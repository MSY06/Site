<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية | منصة دورات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#092b4c;--green:#08b98b;--bg:#f3fbf9;--text:#132e47;--muted:#6b7f8d}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Cairo",sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.6}
.container{width:min(1150px,calc(100% - 30px));margin:auto}
header{background:var(--navy);color:white;padding:15px 0;position:sticky;top:0;z-index:50;box-shadow:0 4px 12px rgba(9,43,76,0.1)}
nav{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:white;text-decoration:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--green);display:grid;place-items:center;font-size:24px}
.btn-outline{color:white;text-decoration:none;border:1px solid rgba(255,255,255,0.3);padding:8px 16px;border-radius:8px;font-size:14px;font-weight:700;transition:0.3s}
.btn-outline:hover{background:rgba(255,255,255,0.1)}

.hero{background:linear-gradient(135deg,#dff7f2,#f3fbf9);padding:60px 0;text-align:center}
.hero h1{font-size:clamp(28px,5vw,42px);color:var(--navy);margin-bottom:15px;font-weight:800}
.hero h1 span{color:var(--green)}
.hero p{color:var(--muted);font-size:clamp(15px,3vw,18px);max-width:700px;margin:0 auto 30px}

.search-container{max-width:600px;margin:0 auto;position:relative}
.search-container input{width:100%;padding:16px 25px;border:1px solid #dcebe7;border-radius:50px;font-size:16px;box-shadow:0 5px 15px rgba(9,43,76,0.05);outline:none;transition:0.3s}
.search-container input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(8,185,139,0.1)}

.categories-wrap{display:flex;gap:10px;overflow-x:auto;padding:20px 0;scrollbar-width:none}
.categories-wrap::-webkit-scrollbar{display:none}
.cat-btn{white-space:nowrap;background:white;border:1px solid #dcebe7;color:var(--navy);padding:10px 20px;border-radius:20px;font-weight:700;cursor:pointer;transition:0.2s}
.cat-btn.active{background:var(--green);color:white;border-color:var(--green);box-shadow:0 4px 12px rgba(8,185,139,0.3)}

.courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:25px;padding-bottom:50px}
.course-card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(9,43,76,0.05);border:1px solid #e0eeeb;transition:0.3s;display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-5px);box-shadow:0 12px 25px rgba(9,43,76,0.1)}
.course-img{height:150px;background:linear-gradient(135deg,#dff7f2,#e0f7f2);display:grid;place-items:center}
.course-icon{width:70px;height:70px;background:var(--green);color:white;border-radius:16px;display:grid;place-items:center;font-size:30px;box-shadow:0 8px 16px rgba(8,185,139,0.3)}
.course-body{padding:20px;flex:1;display:flex;flex-direction:column}
.course-cat{font-size:12px;color:var(--green);font-weight:800;margin-bottom:8px}
.course-title{font-size:18px;color:var(--navy);font-weight:700;margin-bottom:15px;line-height:1.4}
.course-footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:15px;border-top:1px solid #f1f5f9}
.course-price{font-size:22px;font-weight:800;color:var(--green)}
.btn-primary{background:var(--green);color:white;text-decoration:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:14px;transition:0.3s}
.btn-primary:hover{background:#07a379}

/* Loader */
.loader-container{display:flex;justify-content:center;padding:50px;grid-column:1/-1}
.spinner{width:40px;height:40px;border:4px solid #e0eeeb;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .hero{padding:40px 15px}
  .courses-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <a href="index.html" class="brand"><span class="logo">▱</span> <span id="brandName">منصة دورات</span></a>
      <a href="login.html" class="btn-outline">دخول الإدارة</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="container">
    <h1 id="heroTitle">تعلم بلا حدود مع <span>منصة دورات</span></h1>
    <p id="heroDesc">طوّر مهاراتك مع أفضل الدورات التدريبية في البرمجة والتصميم والتسويق والأعمال.</p>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="ابحث عن دورة، مدرب، أو قسم...">
    </div>
  </div>
</section>

<div class="container">
  <div class="categories-wrap" id="categoriesBox"></div>
  <div class="courses-grid" id="coursesGrid">
    <div class="loader-container"><div class="spinner"></div></div>
  </div>
</div>

<script>
  const URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const H = { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` };
  let allCourses = [], currentCat = 'الكل';

  async function init() {
    try {
      // Load Settings
      let res = await fetch(`${URL}/site_settings`, { headers: H });
      let settings = await res.json();
      settings.forEach(s => {
        if(s.key === 'brand') document.getElementById('brandName').innerText = s.value;
        if(s.key === 'hero_title') document.getElementById('heroTitle').innerHTML = s.value;
        if(s.key === 'hero_desc') document.getElementById('heroDesc').innerText = s.value;
      });

      // Load Categories
      res = await fetch(`${URL}/categories`, { headers: H });
      let cats = await res.json();
      document.getElementById('categoriesBox').innerHTML = `<button class="cat-btn active" onclick="filterCat('الكل', this)">الكل</button>` + 
        cats.map(c => `<button class="cat-btn" onclick="filterCat('${c.name}', this)">${c.name}</button>`).join('');

      // Load Courses
      res = await fetch(`${URL}/courses?published=eq.true&order=created_at.desc`, { headers: H });
      allCourses = await res.json();
      renderCourses();
    } catch(e) {
      document.getElementById('coursesGrid').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:red">حدث خطأ في تحميل البيانات.</p>';
    }
  }

  function renderCourses() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allCourses.filter(c => 
      (currentCat === 'الكل' || c.category === currentCat) && 
      (c.title.toLowerCase().includes(q) || (c.instructor && c.instructor.toLowerCase().includes(q)))
    );

    if(filtered.length === 0) {
      document.getElementById('coursesGrid').innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--muted)">لا توجد دورات تطابق بحثك.</p>';
      return;
    }

    document.getElementById('coursesGrid').innerHTML = filtered.map(c => `
      <article class="course-card">
        <div class="course-img"><div class="course-icon">${c.icon || '▤'}</div></div>
        <div class="course-body">
          <div class="course-cat">${c.category}</div>
          <h3 class="course-title">${c.title}</h3>
          <div style="font-size:13px; color:var(--muted); margin-bottom:15px;">👤 ${c.instructor || 'فريق المنصة'}</div>
          <div class="course-footer">
            <div class="course-price">${c.price} ر.س</div>
            <a href="course.html?id=${c.id}" class="btn-primary">التفاصيل ←</a>
          </div>
        </div>
      </article>
    `).join('');
  }

  window.filterCat = (cat, el) => {
    currentCat = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderCourses();
  };

  document.getElementById('searchInput').addEventListener('input', renderCourses);
  init();
</script>
</body>
</html>
