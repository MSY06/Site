<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة دورات | تعلّم بلا حدود</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#092b4c;--green:#08b98b;--bg:#f3fbf9;--text:#132e47;--muted:#6b7f8d}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Cairo",sans-serif}
body{background:var(--bg);color:var(--text)}
.container{width:min(1150px,calc(100% - 30px));margin:auto}
header{background:var(--navy);color:white;padding:15px 0;position:sticky;top:0;z-index:10}
nav{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;text-decoration:none;color:white}
.logo{width:40px;height:40px;border-radius:10px;background:var(--green);display:grid;place-items:center}
.btn{border:0;border-radius:10px;padding:10px 20px;background:var(--green);color:white;font-weight:800;text-decoration:none;font-size:14px}
.hero{background:linear-gradient(130deg,#dff7f2,#f2fbf9 65%,#d3f4eb);padding:40px 0}
.hero-inner{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center}
h1{font-size:clamp(28px,5vw,48px);line-height:1.3;color:var(--navy);margin-bottom:15px}
h1 span{color:var(--green)}
.hero p{color:#506a7a;font-size:16px;line-height:1.8}
.circle{width:min(280px,90%);aspect-ratio:1;border-radius:48%;background:linear-gradient(145deg,#00b98b,#78e8c9);display:grid;place-items:center;font-size:80px;box-shadow:0 20px 40px #08b98b30;margin:auto}
.search-row{display:flex;gap:10px;margin:30px 0 20px}
.search{flex:1;display:flex;align-items:center;gap:10px;padding:0 15px;background:white;border:1px solid #dcebe7;border-radius:12px}
.search input{width:100%;padding:15px 0;border:0;outline:0;font-family:inherit}
.categories{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px}
.categories::-webkit-scrollbar{display:none}
.category{white-space:nowrap;border:1px solid #bfd8d7;background:white;color:var(--navy);border-radius:12px;padding:8px 16px;font-weight:700;cursor:pointer}
.category.active{background:var(--green);color:white;border-color:var(--green)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:40px}
.course{background:white;border-radius:16px;overflow:hidden;box-shadow:0 5px 15px rgba(9,43,76,0.05);border:1px solid #e0eeeb;display:flex;flex-direction:column;transition:0.2s}
.course:hover{transform:translateY(-5px)}
.course-art{height:140px;background:linear-gradient(135deg,#dff8f1,#f5fcfa);display:grid;place-items:center}
.art-icon{width:70px;height:70px;border-radius:16px;background:var(--green);color:white;display:grid;place-items:center;font-size:30px}
.course-body{padding:20px;flex:1;display:flex;flex-direction:column}
.course-category{font-size:12px;color:#079b79;font-weight:800;margin-bottom:5px}
.course h3{color:var(--navy);font-size:18px;margin-bottom:15px;line-height:1.5}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:15px;border-top:1px solid #edf3f1}
.price{font-size:22px;font-weight:900;color:var(--green)}
@media(max-width:768px){
  .hero-inner{grid-template-columns:1fr;text-align:center}
  .hero .circle{display:none}
  .courses{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><div class="container"><nav><a class="brand" href="#"><span class="logo">▱</span> منصة دورات</a><a href="login.html" class="btn" style="background:transparent;border:1px solid white;">دخول الإدارة</a></nav></div></header>
<section class="hero"><div class="container hero-inner"><div><h1>تعلم بلا حدود مع <span>منصة دورات</span></h1><p>طوّر مهاراتك مع أفضل الدورات التدريبية في البرمجة والتصميم والتسويق والأعمال، وابدأ رحلتك نحو مستقبل أفضل.</p></div><div class="circle">🎓</div></div></section>
<div class="container">
  <div class="search-row"><label class="search">⌕ <input id="searchInput" placeholder="ابحث عن دورة أو مدرب..."></label></div>
  <div class="categories" id="categories"><button class="category active" data-cat="الكل">الكل</button></div>
  <div class="courses" id="coursesGrid"><p style="text-align:center;width:100%">جاري تحميل الدورات...</p></div>
</div>

<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const HEADERS = { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` };
  let allCourses = [], currentCat = 'الكل';

  async function loadData() {
    try {
      let res = await fetch(`${API_URL}/categories`, { headers: HEADERS });
      let cats = await res.json();
      let catHTML = `<button class="category active" onclick="filterCat('الكل', this)">الكل</button>`;
      catHTML += cats.map(c => `<button class="category" onclick="filterCat('${c.name}', this)">${c.name}</button>`).join('');
      document.getElementById('categories').innerHTML = catHTML;

      res = await fetch(`${API_URL}/courses?published=eq.true&order=created_at.desc`, { headers: HEADERS });
      allCourses = await res.json();
      renderCourses();
    } catch(e) { document.getElementById('coursesGrid').innerHTML = 'حدث خطأ في الاتصال.'; }
  }

  function renderCourses() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allCourses.filter(c => 
      (currentCat === 'الكل' || c.category === currentCat) && 
      (c.title.toLowerCase().includes(q) || (c.instructor && c.instructor.toLowerCase().includes(q)))
    );
    
    document.getElementById('coursesGrid').innerHTML = filtered.length ? filtered.map(c => `
      <article class="course">
        <div class="course-art"><div class="art-icon">${c.icon || '▤'}</div></div>
        <div class="course-body">
          <div class="course-category">${c.category}</div>
          <h3>${c.title}</h3>
          <div style="font-size:12px;color:var(--muted);margin-bottom:15px;">👤 ${c.instructor || 'فريق المنصة'}</div>
          <div class="bottom">
            <div class="price">${c.price} ر.س</div>
            <a href="course.html?id=${c.id}" class="btn">التفاصيل ←</a>
          </div>
        </div>
      </article>
    `).join('') : '<p style="text-align:center;width:100%">لا توجد دورات مطابقة.</p>';
  }

  window.filterCat = (cat, btn) => {
    currentCat = cat;
    document.querySelectorAll('.category').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCourses();
  };

  document.getElementById('searchInput').addEventListener('input', renderCourses);
  loadData();
</script>
</body>
</html>
