<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة دورات | تعلّم بلا حدود</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0f172a; --green: #10b981; --bg: #f8fafc; --muted: #64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg); color: var(--navy); line-height: 1.6; }
  header { background: var(--navy); color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 50; display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .brand span { background: var(--green); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; }
  .btn-outline { color: white; text-decoration: none; border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .hero { text-align: center; padding: 50px 20px; background: linear-gradient(180deg, #e0f2fe 0%, var(--bg) 100%); }
  .hero h1 { font-size: clamp(28px, 5vw, 42px); margin-bottom: 10px; }
  .search-bar { max-width: 600px; margin: 20px auto 0; }
  .search-bar input { width: 100%; padding: 15px 20px; border<section: 1px solid #cbd5e1 class; border-radius: 50px; font-size: 16px="; outline: none; }
  .container { max-widthhero: 1200px; margin: 30px auto; padding: 0 20px; }
  .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
  .cat-btn { background: white; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: 600; color: var(--navy); }
  .cat-btn.active { background: var(--green); color: white; border-color: var(--green); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; flex-direction: column; transition: 0.3s; }
  .card:hover { transform: translateY(-5px); }
  .card-img { height: 140px; background: linear-gradient(135deg, #10b981, #059669); display: grid; place-items: center; font-size: 40px; color: white; }
  .card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
  .card-title { font-size: 18px; margin-bottom: 10px; font-weight: 700; }
  .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid #f1f5f9; }
  .price { font-size: 20px; font-weight: 800; color: var(--green); }
  .btn { background: var(--green); color: white; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="brand"><span>▱</span> منصة دورات</div>
  <a href="login.html" class="btn-outline">دخول الإدارة</a>
</header>

">
  <h1>اكتشف مهاراتك الجديدة</h1>
  <div class="search-bar"><input type="text" id="searchInput" placeholder="ابحث عن دورة، مدرب..."></div>
</section>

<div class="container">
  <div class="categories" id="categoriesContainer"></div>
  <div class="grid" id="coursesGrid"></div>
</div>

<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  let allCourses = [], currentCat = 'الكل';

  async function loadData() {
    // جلب الأقسام
    let res = await fetch(`${API_URL}/categories?select=*`, { headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` } });
    let cats = await res.json();
    let catHTML = `<button class="cat-btn active" onclick="filterCat('الكل', this)">الكل</button>`;
    catHTML += cats.map(c => `<button class="cat-btn" onclick="filterCat('${c.name}', this)">${c.name}</button>`).join('');
    document.getElementById('categoriesContainer').innerHTML = catHTML;

    // جلب الدورات
    res = await fetch(`${API_URL}/courses?published=eq.true&order=created_at.desc`, { headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` } });
    allCourses = await res.json();
    renderCourses();
  }

  function renderCourses() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allCourses.filter(c => 
      (currentCat === 'الكل' || c.category === currentCat) &&
      (c.title.toLowerCase().includes(q) || c.instructor.toLowerCase().includes(q))
    );
    
    document.getElementById('coursesGrid').innerHTML = filtered.length ? filtered.map(c => `
      <div class="card">
        <div class="card-img">${c.icon || '📚'}</div>
        <div class="card-body">
          <div style="color:var(--green); font-size:12px; font-weight:700;">${c.category}</div>
          <h3 class="card-title">${c.title}</h3>
          <div style="font-size:12px; color:var(--muted);">👤 ${c.instructor} | 👁️ ${c.views || 0} مشاهدة</div>
          <div class="card-footer">
            <div class="price">${c.price} ر.س</div>
            <a href="course.html?id=${c.id}" class="btn">التفاصيل</a>
          </div>
        </div>
      </div>
    `).join('') : '<p style="text-align:center; grid-column:1/-1;">لا توجد دورات تطابق بحثك.</p>';
  }

  window.filterCat = (cat, btn) => {
    currentCat = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCourses();
  };

  document.getElementById('searchInput').addEventListener('input', renderCourses);
  loadData();
</script>
</body>
</html>
