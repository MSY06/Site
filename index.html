<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة دورات | تعلّم بلا حدود</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --navy: #092b4c; --green: #08b98b; --bg: #f3fbf9; --text: #132e47; }
  body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--navy); color: white; padding: 15px 0; }
  .container { width: min(1100px, 90%); margin: auto; }
  nav { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
  .brand span { background: var(--green); width: 35px; height: 35px; display: grid; place-items: center; border-radius: 10px; }
  .btn { background: var(--green); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  .hero { text-align: center; padding: 60px 20px; background: linear-gradient(135deg, #e0f7f2, #f3fbf9); }
  .hero h1 { font-size: 40px; color: var(--navy); margin-bottom: 10px; }
  .hero p { color: #6b7f8d; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px 0; }
  .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; }
  .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
  .card-body { padding: 20px; }
  .card-cat { color: var(--green); font-size: 12px; font-weight: bold; }
  .card-title { font-size: 18px; margin: 10px 0; color: var(--navy); }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
  .price { font-size: 20px; font-weight: 900; color: var(--green); }
  .search-bar { display: flex; justify-content: center; margin-top: -25px; }
  .search-bar input { width: 100%; max-width: 500px; padding: 15px; border: none; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); font-family: inherit; outline: none; }
  .loading { text-align: center; padding: 40px; font-weight: bold; color: var(--navy); }
</style>
</head>
<body>
<header>
  <div class="container">
    <nav>
      <div class="brand"><span>▱</span> منصة دورات</div>
      <a href="login.html" class="btn" style="background: transparent; border: 1px solid white;">دخول الإدارة</a>
    </nav>
  </div>
</header>
<section class="hero">
  <div class="container">
    <h1>تعلّم بلا حدود، وطوّر مهاراتك</h1>
    <p>أفضل الدورات التدريبية في البرمجة، التصميم، التسويق، والأعمال.</p>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="ابحث عن دورة أو مدرب...">
    </div>
  </div>
</section>

<div class="container">
  <div class="grid" id="coursesGrid">
    <div class="loading">جاري تحميل الدورات...</div>
  </div>
</div>

<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  let allCourses = [];

  async function fetchCourses() {
    try {
      const res = await fetch(`${API_URL}/courses?published=eq.true&order=created_at.desc`, {
        headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` }
      });
      allCourses = await res.json();
      renderCourses(allCourses);
    } catch (e) {
      document.getElementById('coursesGrid').innerHTML = '<div class="loading">حدث خطأ في الاتصال.</div>';
    }
  }

  function renderCourses(courses) {
    const grid = document.getElementById('coursesGrid');
    if(courses.length === 0) {
      grid.innerHTML = '<div class="loading">لا توجد دورات متاحة حالياً.</div>';
      return;
    }
    grid.innerHTML = courses.map(c => `
      <div class="card">
        <div style="height:120px; background:linear-gradient(45deg,#08b98b,#0fd8a5); display:grid; place-items:center; font-size:40px; color:white;">
          ${c.icon || '▤'}
        </div>
        <div class="card-body">
          <div class="card-cat">${c.category}</div>
          <h3 class="card-title">${c.title}</h3>
          <div style="font-size:12px; color:#6b7f8d;">المدرب: ${c.instructor}</div>
          <div class="card-footer">
            <div class="price">${c.price} ر.س</div>
            <a href="course.html?id=${c.id}" class="btn">التفاصيل ←</a>
          </div>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    renderCourses(allCourses.filter(c => c.title.toLowerCase().includes(q) || c.instructor.toLowerCase().includes(q)));
  });

  fetchCourses();
</script>
</body>
</html>
