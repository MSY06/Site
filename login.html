<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | دورات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tajawal,sans-serif;min-height:100vh;background:linear-gradient(135deg,#4A6B57,#6B8F7A);display:flex;align-items:center;justify-content:center;padding:20px;color:#2E2A24}.box{background:#FBF8F3;width:100%;max-width:400px;border-radius:26px;padding:28px;box-shadow:0 20px 60px #0002;text-align:center}.logo{width:64px;height:64px;border-radius:18px;background:#4A6B57;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 15px}h1{font-size:22px}.sub{font-size:13px;color:#8A857D;margin:8px 0 22px}.field{text-align:right;margin:12px 0}label{display:block;font-weight:800;font-size:12px;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #e5dccf;border-radius:12px;background:#fff;font:inherit}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#4A6B57;color:#fff;font:inherit;font-weight:900;cursor:pointer}#err{color:#c65e49;font-size:13px;font-weight:700;margin-top:12px;min-height:20px}.back{display:block;margin-top:16px;color:#4A6B57;text-decoration:none;font-weight:800;font-size:13px}
</style></head><body><main class="box"><div class="logo">د</div><h1>تسجيل الدخول إلى الإدارة</h1><p class="sub">خاص بالمدير فقط</p><div class="field"><label for="email">اسم المستخدم</label><input id="email" type="text" autocomplete="username" placeholder="اسم المستخدم المسجل في قاعدة البيانات"></div><div class="field"><label for="password">كلمة السر</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••"></div><button id="loginBtn" onclick="login()">دخول لوحة التحكم</button><p id="err"></p><a class="back" href="index.html">العودة إلى واجهة الدورات</a></main>
<script>
const SB_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co";
const SB_KEY = "sb_publishable_D-ZORF2XC_DpamNWMqO9g_td_P_2b0D";
const REST = SB_URL + "/rest/v1";
const H = { 'apikey': SB_KEY, 'Content-Type': 'application/json' };
async function login(){
 const username=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const err=document.getElementById('err');
 const btn=document.getElementById('loginBtn');
 err.textContent='';
 if(!username||!password){err.textContent='أدخل اسم المستخدم وكلمة السر';return;}
 btn.disabled=true;btn.textContent='جارٍ التحقق...';
 try{
   const res=await fetch(`${REST}/rpc/verify_admin_login`,{
     method:'POST',headers:{...H,'Accept':'application/json'},
     body:JSON.stringify({p_username:username,p_password:password})
   });
   const raw=await res.text();
   let data;try{data=raw?JSON.parse(raw):null;}catch(_){data=raw;}
   if(!res.ok){
     console.error('Supabase login error',res.status,data);
     if(res.status===404) err.textContent='دالة verify_admin_login غير موجودة أو اسمها غير صحيح.';
     else if(res.status===401||res.status===403) err.textContent='رفضت قاعدة البيانات الطلب. تحقق من صلاحيات تنفيذ الدالة.';
     else if(res.status===400) err.textContent='بيانات الطلب لا تطابق معاملات دالة تسجيل الدخول. تحقق من p_username و p_password.';
     else err.textContent='خطأ من قاعدة البيانات ('+res.status+'): '+(typeof data==='string'?data:JSON.stringify(data));
     return;
   }
   const ok=data===true || data?.success===true;
   if(ok){localStorage.setItem('dawrat_logged','true');location.href='admin.html';}
   else {localStorage.removeItem('dawrat_logged');err.textContent='اسم المستخدم أو كلمة السر غير صحيحين.';}
 }catch(e){console.error(e);err.textContent='تعذر الاتصال بـ Supabase. تحقق من الإنترنت وإعدادات المشروع.';}
 finally{btn.disabled=false;btn.textContent='دخول لوحة التحكم';}
}
</script></body></html>
