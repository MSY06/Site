<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل دخول الإدارة | منصة دورات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #092b4c; --green: #08b98b; --bg: #f3fbf9; }
  body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; color: var(--navy); }
  .login-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(9, 43, 76, 0.1); width: 100%; max-width: 400px; text-align: center; }
  h2 { margin-top: 0; font-size: 24px; }
  p { font-size: 13px; color: #6b7f8d; margin-bottom: 20px; }
  input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dfede9; border-radius: 10px; box-sizing: border-box; font-family: inherit; outline: none; background: #f9fdfc; }
  input:focus { border-color: var(--green); background: white; }
  button { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; font-family: inherit; }
  button:hover { background: #07a379; }
  button:disabled { opacity: 0.7; cursor: not-allowed; }
  .error { color: #c8324a; background: #fff0f2; border: 1px solid #f5c2c7; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 15px; display: none; text-align: left; direction: ltr; word-wrap: break-word; }
</style>
</head>
<body>

<div class="login-box">
  <h2>لوحة تحكم الإدارة</h2>
  <p>أدخل بيانات الدخول الخاصة بك للوصول إلى لوحة التحكم</p>
  
  <form id="loginForm">
    <input type="email" id="email" placeholder="البريد الإلكتروني" required dir="ltr" style="text-align: left;" value="admin@dewerat.com">
    <input type="password" id="password" placeholder="الكود السري" required dir="ltr" style="text-align: left;" value="Dewerat@2026">
    <button type="submit" id="submitBtn">دخول آمن</button>
    <div class="error" id="errorMsg"></div>
  </form>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errorDiv = document.getElementById('errorMsg');
    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('password').value.trim();

    btn.textContent = 'جاري التحقق...';
    btn.disabled = true;
    errorDiv.style.display = 'none';

    const SUPABASE_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co";
    const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";

    try {
      // استخدام fetch مباشرة بدلاً من المكتبة
      const response = await fetch(SUPABASE_URL + '/rest/v1/rpc/verify_admin_login', {
        method: 'POST',
        headers: {
          'apikey': API_KEY,
          'Authorization': 'Bearer ' + API_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          input_email: email,
          input_code: code
        })
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`فشل الاتصال بقاعدة البيانات (كود ${response.status}): ${errText}`);
      }

      const isAdmin = await response.json();

      if (isAdmin === true) {
        // نجاح الدخول
        localStorage.setItem('dawrat_admin_logged', 'true');
        window.location.href = 'admin.html';
      } else {
        // بيانات خاطئة
        errorDiv.textContent = 'البريد الإلكتروني أو الكود السري غير صحيح.';
        errorDiv.style.display = 'block';
        btn.textContent = 'دخول آمن';
        btn.disabled = false;
      }
    } catch (err) {
      // عرض الخطأ الفني بالتفصيل على الشاشة
      errorDiv.textContent = err.message;
      errorDiv.style.display = 'block';
      btn.textContent = 'دخول آمن';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
