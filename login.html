<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل دخول الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin: 0; font-family: 'Cairo', sans-serif; background: #f3fbf9; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #092b4c; }
  .login-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(9, 43, 76, 0.1); width: 100%; max-width: 400px; text-align: center; }
  input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dfede9; border-radius: 10px; box-sizing: border-box; font-family: inherit; }
  button { width: 100%; padding: 12px; background: #08b98b; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

<div class="login-box">
  <h2>لوحة تحكم الإدارة</h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="البريد الإلكتروني" required dir="ltr">
    <input type="password" id="password" placeholder="الكود السري" required dir="ltr">
    <button type="submit" id="submitBtn">دخول آمن</button>
  </form>
</div>

<script>
  const SUPABASE_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('password').value.trim();

    btn.textContent = 'جاري التحقق...';
    btn.disabled = true;

    try {
      // استدعاء دالة التحقق
      const { data, error } = await supabase.rpc('verify_admin_login', {
        input_email: email,
        input_code: code
      });

      // --- نظام التشخيص ---
      alert("رد السيرفر: " + JSON.stringify(data) + "\nالخطأ (إن وجد): " + JSON.stringify(error));
      // --------------------

      if (error) throw error;

      if (data === true) {
        localStorage.setItem('dawrat_admin_logged', 'true');
        window.location.href = 'admin.html';
      } else {
        alert("البيانات غير صحيحة! تأكد من الإيميل والكود.");
        btn.textContent = 'دخول آمن';
        btn.disabled = false;
      }
    } catch (err) {
      alert("حدث خطأ تقني: " + err.message);
      btn.textContent = 'دخول آمن';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
