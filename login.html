<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:Cairo,sans-serif;background:#f3fbf9;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:white;padding:30px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.1);width:100%;max-width:350px;text-align:center}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-family:inherit}
button{width:100%;padding:12px;background:#08b98b;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-family:inherit}
.err{color:red;font-size:12px;margin-top:10px;display:none;word-wrap:break-word;text-align:left;background:#fff0f2;padding:10px;border-radius:5px;}
</style>
</head>
<body>
<div class="box">
  <h2 style="color:#092b4c">دخول الإدارة</h2>
  <form id="f">
    <input type="email" id="email" value="admin@dewerat.com" required>
    <input type="password" id="password" value="Dewerat@2026" required>
    <button type="submit" id="btn">دخول</button>
    <div id="err" class="err"></div>
  </form>
</div>
<script>
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    btn.textContent = 'جاري التحقق...';
    err.style.display = 'none';
    
    try {
      const res = await fetch("https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1/rpc/verify_admin_login", {
        method: 'POST',
        headers: {
          'apikey': "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D",
          'Authorization': "Bearer sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D",
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          input_email: document.getElementById('email').value.trim(),
          input_code: document.getElementById('password').value.trim()
        })
      });
      
      if(!res.ok) throw new Error("خطأ: " + await res.text());
      const data = await res.json();
      
      if(data === true) {
        localStorage.setItem('dawrat_admin_logged', 'true');
        window.location.href = 'admin.html';
      } else {
        err.textContent = 'البيانات غير صحيحة!'; err.style.display = 'block'; btn.textContent = 'دخول';
      }
    } catch(ex) {
      err.textContent = ex.message; err.style.display = 'block'; btn.textContent = 'دخول';
    }
  };
</script>
</body>
</html>
