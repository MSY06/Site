<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الإدارة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f5f5; /* لون الخلفية الفاتح */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #ffffff;
            width: 90%;
            max-width: 350px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .login-title {
            color: #1a2b4c; /* اللون الكحلي الغامق */
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #00c283;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background-color: #00c283; /* اللون الأخضر */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #00a36c;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-title">لوحة تحكم الإدارة</div>
        
        <!-- تمت إضافة autocomplete="off" هنا -->
        <form action="#" method="POST" autocomplete="off">
            
            <div class="input-group">
                <!-- حقل البريد الإلكتروني -->
                <input type="text" name="email" placeholder="البريد الإلكتروني" value="admin@dewerat.com" autocomplete="off" required>
            </div>

            <div class="input-group">
                <!-- حقل كلمة المرور: تم استخدام new-password لمنع التعبئة التلقائية -->
                <input type="password" name="password" placeholder="كلمة المرور" autocomplete="new-password" required>
            </div>

            <!-- حيلة إضافية لمنع المتصفحات العنيدة من تعبئة كلمة المرور -->
            <input type="password" style="display:none;" autocomplete="new-password">

            <button type="submit" class="login-btn">دخول آمن</button>
        </form>
    </div>

</body>
</html>
