
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | دورات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tajawal,sans-serif;min-height:100vh;background:linear-gradient(135deg,#4A6B57,#6B8F7A);display:flex;align-items:center;justify-content:center;padding:20px;color:#2E2A24}.box{background:#FBF8F3;width:100%;max-width:400px;border-radius:26px;padding:28px;box-shadow:0 20px 60px #0002;text-align:center}.logo{width:64px;height:64px;border-radius:18px;background:#4A6B57;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 15px}h1{font-size:22px}.sub{font-size:13px;color:#8A857D;margin:8px 0 22px}.field{text-align:right;margin:12px 0}label{display:block;font-weight:800;font-size:12px;margin-bottom:6px}input{width:100%;padding:13px;border:1px solid #e5dccf;border-radius:12px;background:#fff;font:inherit}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#4A6B57;color:#fff;font:inherit;font-weight:900;cursor:pointer}#err{color:#c65e49;font-size:13px;font-weight:700;margin-top:12px;min-height:20px}.back{display:block;margin-top:16px;color:#4A6B57;text-decoration:none;font-weight:800;font-size:13px}
</style></head><body><main class="box"><div class="logo">د</div><h1>تسجيل الدخول إلى الإدارة</h1><p class="sub">خاص بالمدير فقط</p><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" placeholder="admin@dorat.com"></div><div class="field"><label for="password">كلمة السر</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••"></div><button id="loginBtn" onclick="login()">دخول لوحة التحكم</button><p id="err"></p><a class="back" href="index.html">العودة إلى واجهة الدورات</a></main>
<script>
const SB_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co";
const SB_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
const REST = SB_URL + "/rest/v1";
const H = { 'apikey': SB_KEY, 'Content-Type': 'application/json' };
async function login(){const email=document.getElementById('email').value.trim(), code=document.getElementById('password').value.trim(), err=document.getElementById('err'), btn=document.getElementById('loginBtn');err.textContent='';if(!email||!code){err.textContent='أدخل البريد وكلمة السر';return}btn.disabled=true;btn.textContent='جارٍ التحقق...';try{const res=await fetch(`${REST}/rpc/verify_admin_login`,{method:'POST',headers:H,body:JSON.stringify({input_email:email,input_code:code})});const data=await res.json().catch(()=>null);if(!res.ok){console.error('Supabase error',res.status,data);err.textContent=res.status===401?'مفتاح API غير صالح':res.status===404?'الدالة verify_admin_login غير موجودة في Supabase':'خطأ ('+res.status+'): '+((data&&(data.message||data.error))||'');return}if(data===true){localStorage.setItem('dawrat_logged','true');location.href='admin.html'}else err.textContent='بيانات غير صحيحة'}catch(e){err.textContent='تعذر الاتصال، حاول مجددًا'}finally{btn.disabled=false;btn.textContent='دخول لوحة التحكم'}}
</script></body></html>
