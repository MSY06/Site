<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الاتصال المباشر</title>
</head>
<body style="font-family: sans-serif; padding: 20px; text-align: center;">
  <h2>اختبار الاتصال المباشر بقاعدة البيانات</h2>
  <button onclick="runTest()" style="padding: 15px 30px; background: green; color: white; border: none; font-size: 18px; cursor:pointer;">اضغط هنا للاختبار</button>
  <pre id="result" style="text-align: left; direction: ltr; background: #eee; padding: 15px; margin-top: 20px; white-space: pre-wrap; word-wrap: break-word;"></pre>

  <script>
    const SUPABASE_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";

    async function runTest() {
      const res = document.getElementById('result');
      res.innerText = "جاري الاتصال المباشر...";
      
      try {
‎        // استدعاء الدالة عبر fetch مباشرة
        const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/verify_admin_login`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            input_email: 'admin@dewerat.com',
            input_code: 'Dewerat@2026'
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          res.innerText = `خطأ HTTP (${response.status}):\n${errText}`;
          return;
        }

        const data = await response.json();
        res.innerText = `الاستجابة:\n${JSON.stringify(data, null, 2)}`;

      } catch (e) {
        res.innerText = `فشل الاتصال:\n${e.message}`;
      }
    }
  </script>
</body>
</html>
