<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#092b4c;--green:#08b98b;--bg:#f3fbf9;--muted:#6b7f8d}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
  body{background:var(--bg);color:#132e47;display:flex;flex-direction:column;min-height:100vh}
  
  /* القائمة العلوية (متجاوبة) */
  .topbar{background:var(--navy);color:white;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:15px 20px;gap:10px;position:sticky;top:0;z-index:100}
  .topbar .logo{font-size:20px;font-weight:900;color:var(--green)}
  .nav-links{display:flex;gap:10px;flex-wrap:wrap}
  .nav-links a{color:#cbd5e1;text-decoration:none;font-weight:700;font-size:14px;cursor:pointer;padding:5px 10px;border-radius:8px}
  .nav-links a.active{background:var(--green);color:white}
  
  .main{padding:20px;max-width:1200px;margin:0 auto;width:100%}
  .panel{display:none}.panel.active{display:block}
  
  /* بطاقات الإحصائيات */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px}
  .card{background:white;padding:20px;border-radius:12px;text-align:center;box-shadow:0 4px 10px rgba(9,43,76,0.05)}
  .card h3{font-size:13px;color:var(--muted);margin-bottom:10px}
  .card .num{font-size:28px;font-weight:900;color:var(--green)}
  
  /* الجداول */
  .table-box{background:white;padding:15px;border-radius:12px;overflow-x:auto;box-shadow:0 4px 10px rgba(9,43,76,0.05)}
  table{width:100%;border-collapse:collapse;min-width:500px}
  th,td{padding:12px;text-align:right;border-bottom:1px solid #eee;font-size:14px}
  th{background:#f9fdfc;color:var(--muted)}
  
  /* الأزرار والحقول */
  .btn{background:var(--green);color:white;border:none;padding:10px 15px;border-radius:8px;font-weight:800;cursor:pointer;font-family:inherit}
  .btn-red{background:#ef4444}.btn-sm{padding:5px 10px;font-size:12px}
  input,select,textarea{width:100%;padding:12px;margin-bottom:10px;border:1px solid #dcebe7;border-radius:8px;font-family:inherit}
  
  /* النوافذ المنبثقة */
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(9,43,76,0.8);display:none;align-items:center;justify-content:center;padding:15px;z-index:1000}
  .modal.active{display:flex}
  .modal-content{background:white;padding:25px;border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
  
  /* صفوف الدروس */
  .lesson-row{display:flex;flex-direction:column;gap:10px;background:#f9fdfc;padding:15px;border-radius:10px;margin-bottom:10px;border:1px solid #dcebe7}
  .progress{height:8px;background:#e2e8f0;border-radius:4px;display:none;margin-top:5px}
  .progress div{height:100%;background:var(--green);width:0%;transition:0.3s}
</style>
</head>
<body>
<script>if(localStorage.getItem('dawrat_logged') !== 'true') window.location.href = 'login.html';</script>

<div class="topbar">
  <div class="logo">لوحة التحكم</div>
  <div class="nav-links">
    <a class="active" onclick="tab('dashboard',this)">📊 نظرة عامة</a>
    <a onclick="tab('courses',this)">📚 الدورات</a>
    <a onclick="tab('cats',this)">🗂️ الأقسام</a>
    <a onclick="tab('enrolls',this)">👥 الطلاب</a>
    <a onclick="localStorage.removeItem('dawrat_logged');location.href='login.html'" style="color:#fca5a5">🚪 خروج</a>
  </div>
</div>

<div class="main">
  <div id="tab-dashboard" class="panel active">
    <div class="stats">
      <div class="card"><h3>إجمالي الدورات</h3><div class="num" id="sCourses">0</div></div>
      <div class="card"><h3>إجمالي الطلاب</h3><div class="num" id="sEnrolls">0</div></div>
    </div>
  </div>

  <div id="tab-courses" class="panel">
    <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
      <h2 style="font-size:20px;">الدورات</h2><button class="btn" onclick="openModal()">+ إضافة</button>
    </div>
    <div class="table-box"><table><thead><tr><th>العنوان</th><th>السعر</th><th>إجراءات</th></tr></thead><tbody id="tCourses"></tbody></table></div>
  </div>

  <div id="tab-cats" class="panel">
    <h2 style="font-size:20px;margin-bottom:15px;">الأقسام</h2>
    <div class="table-box" style="margin-bottom:15px;display:flex;gap:10px;">
      <input type="text" id="newCat" placeholder="اسم القسم..." style="margin:0;">
      <button class="btn" onclick="addCat()">إضافة</button>
    </div>
    <div class="table-box"><table><tbody id="tCats"></tbody></table></div>
  </div>

  <div id="tab-enrolls" class="panel">
    <h2 style="font-size:20px;margin-bottom:15px;">الطلاب</h2>
    <div class="table-box"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الدورة</th></tr></thead><tbody id="tEnrolls"></tbody></table></div>
  </div>
</div>

<div class="modal" id="courseModal">
  <div class="modal-content">
    <h2 style="margin-bottom:15px;font-size:20px" id="mTitle">إضافة دورة</h2>
    <input type="hidden" id="cId">
    <input type="text" id="cTitle" placeholder="عنوان الدورة">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <select id="cCategory"></select>
      <input type="number" id="cPrice" placeholder="السعر" value="0">
    </div>
    <input type="text" id="cInstructor" placeholder="المدرب" value="فريق المنصة">
    <textarea id="cDesc" placeholder="وصف الدورة" rows="2"></textarea>
    
    <h3 style="font-size:16px;margin:15px 0 10px;">الدروس</h3>
    <div id="lessonsBox"></div>
    <button class="btn" type="button" onclick="addLesson()" style="background:#6b7f8d;width:100%;margin-bottom:15px;">+ إضافة درس</button>
    
    <button class="btn" style="width:100%;margin-bottom:10px;" onclick="save()">حفظ الكل</button>
    <button class="btn btn-red" style="width:100%;" onclick="document.getElementById('courseModal').classList.remove('active')">إلغاء</button>
  </div>
</div>

<script>
  const URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const STORAGE = "https://rzostpeiwkdfpozhqsrv.supabase.co/storage/v1/object/public/videos/";
  const KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const H = { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' };
  let courses = [], cats = [], enrolls = [], currentLessons = [];

  function tab(id, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    if(el) el.classList.add('active');
  }

  async function load() {
    let r = await fetch(`${URL}/categories`, { headers: H }); cats = await r.json();
    document.getElementById('cCategory').innerHTML = cats.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
    document.getElementById('tCats').innerHTML = cats.map(c => `<tr><td>${c.name}</td><td><button class="btn btn-red btn-sm" onclick="delCat('${c.id}')">حذف</button></td></tr>`).join('');

    r = await fetch(`${URL}/courses?select=*,course_lessons(*)&order=created_at.desc`, { headers: H }); courses = await r.json();
    document.getElementById('tCourses').innerHTML = courses.map(c => `<tr><td>${c.title}</td><td>${c.price} ر.س</td><td><button class="btn btn-sm" onclick="edit('${c.id}')">تعديل</button> <button class="btn btn-red btn-sm" onclick="del('${c.id}')">حذف</button></td></tr>`).join('');

    r = await fetch(`${URL}/enrollments?select=*,courses(title)`, { headers: H }); enrolls = await r.json();
    document.getElementById('tEnrolls').innerHTML = enrolls.map(e => `<tr><td>${e.full_name}</td><td>${e.email}</td><td>${e.courses?.title || '-'}</td></tr>`).join('');

    document.getElementById('sCourses').innerText = courses.length;
    document.getElementById('sEnrolls').innerText = enrolls.length;
  }

  window.addCat = async () => {
    const v = document.getElementById('newCat').value;
    if(v) { await fetch(`${URL}/categories`, { method: 'POST', headers: H, body: JSON.stringify({ name: v }) }); document.getElementById('newCat').value = ''; load(); }
  };
  window.delCat = async (id) => { if(confirm('حذف؟')) { await fetch(`${URL}/categories?id=eq.${id}`, { method: 'DELETE', headers: H }); load(); } };
  window.del = async (id) => { if(confirm('حذف؟')) { await fetch(`${URL}/courses?id=eq.${id}`, { method: 'DELETE', headers: H }); load(); } };

  window.openModal = () => {
    document.getElementById('cId').value = ''; document.getElementById('cTitle').value = ''; document.getElementById('cDesc').value = '';
    document.getElementById('cPrice').value = '0'; document.getElementById('cInstructor').value = 'فريق المنصة';
    currentLessons = []; renderLessons();
    document.getElementById('mTitle').innerText = 'إضافة دورة';
    document.getElementById('courseModal').classList.add('active');
  };

  window.edit = (id) => {
    const c = courses.find(x => x.id == id); if(!c) return;
    document.getElementById('cId').value = c.id; document.getElementById('cTitle').value = c.title;
    document.getElementById('cCategory').value = c.category; document.getElementById('cPrice').value = c.price;
    document.getElementById('cInstructor').value = c.instructor; document.getElementById('cDesc').value = c.description || '';
    currentLessons = (c.course_lessons || []).map(l => ({...l, tempId: Date.now() + Math.random()})); renderLessons();
    document.getElementById('mTitle').innerText = 'تعديل دورة';
    document.getElementById('courseModal').classList.add('active');
  };

  window.addLesson = () => { currentLessons.push({ tempId: Date.now(), title: '', video_url: '' }); renderLessons(); };
  window.delLesson = (tid) => { currentLessons = currentLessons.filter(l => l.tempId !== tid); renderLessons(); };

  function renderLessons() {
    document.getElementById('lessonsBox').innerHTML = currentLessons.map((l, i) => `
      <div class="lesson-row">
        <input type="text" placeholder="عنوان الدرس" value="${l.title}" oninput="currentLessons[${i}].title=this.value" style="margin:0">
        ${l.video_url ? `<div style="color:var(--green);font-weight:bold;font-size:12px;">✓ تم رفع الفيديو</div>` : `
          <input type="file" accept="video/*" onchange="upload(this, ${i})" style="margin:0;font-size:12px;">
          <div class="progress" id="p-${i}"><div id="pf-${i}"></div></div>
        `}
        <button class="btn btn-red btn-sm" type="button" onclick="delLesson(${l.tempId})">حذف</button>
      </div>
    `).join('');
  }

  // 🔥 رفع الفيديو المضمون 100%
  window.upload = (input, index) => {
    const file = input.files[0]; if(!file) return;
    const name = `v_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
    const bar = document.getElementById('p-'+index), fill = document.getElementById('pf-'+index);
    bar.style.display = 'block'; input.disabled = true;

    const xhr = new XMLHttpRequest();
    xhr.open('POST', `https://rzostpeiwkdfpozhqsrv.supabase.co/storage/v1/object/videos/${name}`);
    xhr.setRequestHeader('apikey', KEY);
    xhr.setRequestHeader('Authorization', `Bearer ${KEY}`);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');

    xhr.upload.onprogress = (e) => { if(e.lengthComputable) fill.style.width = (e.loaded/e.total)*100 + '%'; };
    xhr.onload = () => {
      if(xhr.status >= 200 && xhr.status < 300) {
        currentLessons[index].video_url = STORAGE + name;
        renderLessons();
      } else { alert('فشل الرفع. تأكد من إعدادات Storage. \n' + xhr.responseText); bar.style.display = 'none'; input.disabled = false; }
    };
    xhr.onerror = () => { alert('خطأ في الشبكة'); bar.style.display = 'none'; input.disabled = false; };
    xhr.send(file);
  };

  window.save = async () => {
    const id = document.getElementById('cId').value;
    const payload = {
      title: document.getElementById('cTitle').value,
      category: document.getElementById('cCategory').value,
      price: Number(document.getElementById('cPrice').value),
      instructor: document.getElementById('cInstructor').value,
      description: document.getElementById('cDesc').value,
      published: true
    };
    let method = id ? 'PATCH' : 'POST';
    let url = id ? `${URL}/courses?id=eq.${id}` : `${URL}/courses`;
    let headers = { ...H };
    if(!id) headers['Prefer'] = 'return=representation';

    let r = await fetch(url, { method, headers, body: JSON.stringify(payload) });
    let res = await r.json();
    let cid = id ? id : res[0].id;

    await fetch(`${URL}/course_lessons?course_id=eq.${cid}`, { method: 'DELETE', headers: H });
    if(currentLessons.length > 0) {
      const lData = currentLessons.map((l, i) => ({ course_id: cid, title: l.title || `الدرس ${i+1}`, video_url: l.video_url, sort_order: i }));
      await fetch(`${URL}/course_lessons`, { method: 'POST', headers: H, body: JSON.stringify(lData) });
    }
    document.getElementById('courseModal').classList.remove('active');
    load(); alert('تم الحفظ!');
  };

  load();
</script>
</body>
</html>
