<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم | منصة دورات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#092b4c;--green:#08b98b;--bg:#f3fbf9;--text:#132e47;}
  body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
  .sidebar{width:250px;background:var(--navy);color:white;padding:20px;box-sizing:border-box}
  .sidebar h2{text-align:center;margin-bottom:30px;color:var(--green)}
  .sidebar a{display:block;color:#ccc;text-decoration:none;padding:12px;border-radius:8px;margin-bottom:5px;transition:0.2s;cursor:pointer}
  .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,0.1);color:white}
  .main{flex:1;padding:30px;box-sizing:border-box;overflow-y:auto}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px}
  .stat-card{background:white;padding:20px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.05);text-align:center}
  .stat-card h3{margin:0;color:#6b7f8d;font-size:14px}.stat-card .num{font-size:32px;font-weight:900;color:var(--navy);margin-top:10px}
  .panel{background:white;padding:25px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.05);display:none}
  .panel.active{display:block}
  .btn{background:var(--green);color:white;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-family:inherit}
  .btn-red{background:#e74c3c}
  table{width:100%;border-collapse:collapse;margin-top:20px}
  th,td{padding:12px;text-align:right;border-bottom:1px solid #eee}
  th{background:#f9fdfc;color:#6b7f8d}
  input,select,textarea{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box;font-family:inherit}
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100}
  .modal.active{display:flex}
  .modal-content{background:white;padding:30px;border-radius:15px;width:90%;max-width:600px;max-height:90vh;overflow-y:auto}
  .lesson-row{display:grid;grid-template-columns:1fr 80px 1fr auto;gap:10px;margin-bottom:10px;align-items:center}
  @media(max-width:768px){ body{flex-direction:column} .sidebar{width:100%} .stats{grid-template-columns:1fr} }
</style>
</head>
<body>
<script>
  if(localStorage.getItem('dawrat_admin_logged') !== 'true') window.location.href = 'login.html';
</script>

<div class="sidebar">
  <h2>لوحة التحكم</h2>
  <a class="active" onclick="showPanel('dashboard')">▦ نظرة عامة</a>
  <a onclick="showPanel('courses')">▤ إدارة الدورات</a>
  <a onclick="showPanel('enrollments')">♙ الطلاب المهتمون</a>
  <a onclick="localStorage.removeItem('dawrat_admin_logged'); window.location.href='login.html'" style="color:#ff8e8e;margin-top:30px">تسجيل خروج ←</a>
</div>

<div class="main">
  <!-- 1. لوحة القيادة -->
  <div id="panel-dashboard" class="panel active">
    <h2>مرحباً بك في لوحة التحكم</h2>
    <div class="stats">
      <div class="stat-card"><h3>إجمالي الدورات</h3><div class="num" id="statCourses">0</div></div>
      <div class="stat-card"><h3>طلبات الاهتمام</h3><div class="num" id="statEnrolls">0</div></div>
    </div>
  </div>

  <!-- 2. إدارة الدورات -->
  <div id="panel-courses" class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>إدارة الدورات</h2>
      <button class="btn" onclick="openCourseModal()">+ إضافة دورة</button>
    </div>
    <table>
      <thead><tr><th>العنوان</th><th>القسم</th><th>السعر</th><th>الحالة</th><th>إجراءات</th></tr></thead>
      <tbody id="coursesTable"></tbody>
    </table>
  </div>

  <!-- 3. المهتمين -->
  <div id="panel-enrollments" class="panel">
    <h2>الطلاب المهتمون</h2>
    <table>
      <thead><tr><th>الاسم</th><th>البريد</th><th>الجوال</th><th>الدورة</th></tr></thead>
      <tbody id="enrollTable"></tbody>
    </table>
  </div>
</div>

<!-- نافذة إضافة/تعديل دورة -->
<div class="modal" id="courseModal">
  <div class="modal-content">
    <h2 id="modalTitle">إضافة دورة</h2>
    <input type="hidden" id="courseId">
    <label>عنوان الدورة</label><input type="text" id="cTitle">
    <label>القسم</label><input type="text" id="cCategory" value="البرمجة">
    <label>المدرب</label><input type="text" id="cInstructor" value="فريق المنصة">
    <label>السعر</label><input type="number" id="cPrice" value="0">
    <label>الوصف</label><textarea id="cDesc" rows="3"></textarea>
    
    <h3 style="margin-top:20px">دروس الدورة (يمكنك رفع فيديو لكل درس)</h3>
    <div id="lessonsContainer"></div>
    <button class="btn" type="button" onclick="addLessonRow()" style="background:#6b7f8d; margin-bottom:20px;">+ إضافة درس جديد</button>
    
    <div style="display:flex; gap:10px;">
      <button class="btn" style="flex:1" onclick="saveCourse()">حفظ الدورة</button>
      <button class="btn btn-red" style="flex:1" onclick="document.getElementById('courseModal').classList.remove('active')">إلغاء</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const STORAGE_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/storage/v1/object/public/videos/";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const HEADERS = { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' };

  let courses = [], enrollments = [];

  function showPanel(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    event.target.classList.add('active');
  }

  async function loadData() {
    // جلب الدورات
    let res = await fetch(`${API_URL}/courses?select=*,course_lessons(*)&order=created_at.desc`, { headers: HEADERS });
    courses = await res.json();
    
    // جلب المهتمين
    res = await fetch(`${API_URL}/enrollments?select=*,courses(title)&order=created_at.desc`, { headers: HEADERS });
    enrollments = await res.json();

    document.getElementById('statCourses').innerText = courses.length;
    document.getElementById('statEnrolls').innerText = enrollments.length;

    document.getElementById('coursesTable').innerHTML = courses.map(c => `
      <tr>
        <td>${c.title}</td><td>${c.category}</td><td>${c.price} ر.س</td>
        <td>${c.published ? 'منشورة' : 'مسودة'}</td>
        <td>
          <button class="btn" style="padding:5px 10px; font-size:12px;" onclick="editCourse('${c.id}')">تعديل</button>
          <button class="btn btn-red" style="padding:5px 10px; font-size:12px;" onclick="deleteCourse('${c.id}')">حذف</button>
        </td>
      </tr>
    `).join('');

    document.getElementById('enrollTable').innerHTML = enrollments.map(e => `
      <tr><td>${e.full_name}</td><td>${e.email}</td><td>${e.phone || '-'}</td><td>${e.courses?.title || 'محذوفة'}</td></tr>
    `).join('');
  }

  // --- إدارة الدورات والدروس ---
  let currentLessons = [];

  window.addLessonRow = (title = '', duration = '', url = '') => {
    const id = Date.now();
    currentLessons.push({ id, title, duration, video_url: url });
    renderLessons();
  };

  window.removeLesson = (id) => {
    currentLessons = currentLessons.filter(l => l.id !== id);
    renderLessons();
  };

  function renderLessons() {
    document.getElementById('lessonsContainer').innerHTML = currentLessons.map((l, i) => `
      <div class="lesson-row">
        <input type="text" placeholder="عنوان الدرس" value="${l.title}" oninput="currentLessons[${i}].title=this.value">
        <input type="text" placeholder="المدة 2:00" value="${l.duration}" oninput="currentLessons[${i}].duration=this.value">
        <input type="file" accept="video/*" onchange="uploadVideo(this, ${i})" ${l.video_url ? 'disabled title="تم الرفع"' : ''}>
        <button class="btn btn-red" type="button" onclick="removeLesson(${l.id})" style="padding:5px 10px;">X</button>
        ${l.video_url ? `<div style="grid-column:1/-1; font-size:12px; color:green;">✓ تم رفع الفيديو</div>` : ''}
      </div>
    `).join('');
  }

  window.uploadVideo = async (input, index) => {
    const file = input.files[0];
    if(!file) return;
    
    input.disabled = true;
    input.parentElement.style.opacity = 0.5;
    
    // توليد اسم فريد للملف
    const fileName = `vid_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
    
    try {
      // رفع الملف مباشرة عبر fetch
      const res = await fetch(`https://rzostpeiwkdfpozhqsrv.supabase.co/storage/v1/object/videos/${fileName}`, {
        method: 'POST',
        headers: {
          'apikey': API_KEY,
          'Authorization': `Bearer ${API_KEY}`,
          'Content-Type': file.type
        },
        body: file
      });

      if(res.ok) {
        currentLessons[index].video_url = STORAGE_URL + fileName;
        renderLessons();
        alert('تم رفع الفيديو بنجاح!');
      } else {
        alert('فشل الرفع: تأكد من إعدادات التخزين.');
        input.disabled = false;
      }
    } catch(e) {
      alert('خطأ في الشبكة أثناء الرفع.');
      input.disabled = false;
    }
  };

  window.openCourseModal = () => {
    document.getElementById('courseId').value = '';
    document.getElementById('cTitle').value = '';
    document.getElementById('cCategory').value = 'البرمجة';
    document.getElementById('cInstructor').value = 'فريق المنصة';
    document.getElementById('cPrice').value = '0';
    document.getElementById('cDesc').value = '';
    currentLessons = [];
    renderLessons();
    document.getElementById('modalTitle').innerText = 'إضافة دورة';
    document.getElementById('courseModal').classList.add('active');
  };

  window.editCourse = (id) => {
    const c = courses.find(x => x.id == id);
    if(!c) return;
    document.getElementById('courseId').value = c.id;
    document.getElementById('cTitle').value = c.title;
    document.getElementById('cCategory').value = c.category;
    document.getElementById('cInstructor').value = c.instructor;
    document.getElementById('cPrice').value = c.price;
    document.getElementById('cDesc').value = c.description || '';
    currentLessons = (c.course_lessons || []).map(l => ({...l, id: Date.now() + Math.random()}));
    renderLessons();
    document.getElementById('modalTitle').innerText = 'تعديل دورة';
    document.getElementById('courseModal').classList.add('active');
  };

  window.saveCourse = async () => {
    const id = document.getElementById('courseId').value;
    const payload = {
      title: document.getElementById('cTitle').value,
      category: document.getElementById('cCategory').value,
      instructor: document.getElementById('cInstructor').value,
      price: Number(document.getElementById('cPrice').value),
      description: document.getElementById('cDesc').value,
      published: true
    };

    let method = id ? 'PATCH' : 'POST';
    let url = id ? `${API_URL}/courses?id=eq.${id}` : `${API_URL}/courses`;
    
    // إضافة الهيدر المطلوب لاسترجاع البيانات بعد الإدخال
    let headers = { ...HEADERS };
    if(!id) headers['Prefer'] = 'return=representation';

    let res = await fetch(url, { method, headers, body: JSON.stringify(payload) });
    let savedCourse = await res.json();
    
    if(!id) savedCourse = savedCourse[0]; // إذا كانت إضافة جديدة، تأتي في مصفوفة
    if(id) savedCourse = { id }; // إذا تعديل، نأخذ الـ id فقط

    // حفظ الدروس
    if(currentLessons.length > 0) {
      // حذف الدروس القديمة أولاً
      await fetch(`${API_URL}/course_lessons?course_id=eq.${savedCourse.id}`, { method: 'DELETE', headers: HEADERS });
      
      // إضافة الدروس الجديدة
      const lessonPayload = currentLessons.map((l, i) => ({
        course_id: savedCourse.id,
        title: l.title,
        duration: l.duration,
        video_url: l.video_url,
        sort_order: i
      }));
      await fetch(`${API_URL}/course_lessons`, { method: 'POST', headers: HEADERS, body: JSON.stringify(lessonPayload) });
    }

    document.getElementById('courseModal').classList.remove('active');
    loadData();
    alert('تم الحفظ بنجاح!');
  };

  window.deleteCourse = async (id) => {
    if(!confirm('هل أنت متأكد من حذف الدورة؟')) return;
    await fetch(`${API_URL}/courses?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
    loadData();
  };

  loadData();
</script>
</body>
</html>
