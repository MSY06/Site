<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0f172a; --green: #10b981; --bg: #f8fafc; --muted: #64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg); color: var(--navy); display: flex; min-height: 100vh; }
  
  /* القائمة الجانبية */
  .sidebar { width: 260px; background: var(--navy); color: white; display: flex; flex-direction: column; padding: 20px 0; position: fixed; height: 100vh; overflow-y: auto; transition: 0.3s; z-index: 100; }
  .sidebar .logo { text-align: center; font-size: 22px; font-weight: 800; padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; color: var(--green); }
  .sidebar a { padding: 15px 25px; color: #cbd5e1; text-decoration: none; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
  .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.05); color: white; border-right: 4px solid var(--green); }
  .sidebar .logout { margin-top: auto; color: #fca5a5; }
  
  /* المحتوى */
  .main { flex: 1; margin-right: 260px; padding: 30px; transition: 0.3s; }
  .mobile-header { display: none; background: var(--navy); padding: 15px 20px; color: white; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 90; }
  .mobile-header button { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
  
  .panel { display: none; animation: fadeIn 0.3s; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  /* البطاقات الإحصائية */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
  .stat-card h3 { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .stat-card .num { font-size: 36px; font-weight: 800; color: var(--navy); }
  
  /* الجداول */
  .card-box { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; margin-bottom: 20px; }
  .table-responsive { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th { text-align: right; padding: 15px; background: #f8fafc; color: var(--muted); font-weight: 700; font-size: 13px; border-bottom: 1px solid #e2e8f0; }
  td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
  
  /* الأزرار */
  .btn { background: var(--green); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 700; font-family: inherit; transition: 0.3s; }
  .btn:hover { background: #059669; }
  .btn-red { background: #ef4444; } .btn-red:hover { background: #dc2626; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  /* النوافذ المنبثقة (Modal) */
  .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
  .modal.active { display: flex; }
  .modal-content { background: white; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; border-radius: 20px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
  .modal-content h2 { margin-bottom: 20px; color: var(--navy); }
  
  /* حقول الإدخال */
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 13px; color: var(--navy); }
  input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 15px; outline: none; }
  input:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
  
  /* صفوف الدروس */
  .lesson-row { display: grid; grid-template-columns: 1fr 80px 1fr auto; gap: 10px; background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 10px; align-items: center; border: 1px solid #e2e8f0; }
  
  /* شاشة الهاتف */
  @media(max-width: 768px) {
    .sidebar { transform: translateX(100%); width: 100%; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-right: 0; padding: 20px 15px; }
    .mobile-header { display: flex; }
    .lesson-row { grid-template-columns: 1fr; }
    .modal-content { padding: 20px; }
  }
</style>
</head>
<body>
<script>
  if(localStorage.getItem('dawrat_admin_logged') !== 'true') window.location.href = 'login.html';
</script>

<div class="mobile-header">
  <div style="font-weight:800;">لوحة التحكم</div>
  <button onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
</div>

<div class="sidebar" id="sidebar">
  <div class="logo">منصة دورات</div>
  <a class="active" onclick="switchTab('dashboard', this)">📊 نظرة عامة</a>
  <a onclick="switchTab('courses', this)">📚 إدارة الدورات</a>
  <a onclick="switchTab('enrollments', this)">👥 الطلاب المهتمون</a>
  <a class="logout" onclick="localStorage.removeItem('dawrat_admin_logged'); window.location.href='login.html'">🚪 تسجيل الخروج</a>
</div>

<div class="main">
  <!-- 1. Dashboard -->
  <div id="tab-dashboard" class="panel active">
    <h2 style="margin-bottom: 25px;">مرحباً بك مجدداً 👋</h2>
    <div class="stats">
      <div class="stat-card"><h3>إجمالي الدورات</h3><div class="num" id="statCourses">0</div></div>
      <div class="stat-card"><h3>طلبات الاهتمام</h3><div class="num" id="statEnrolls">0</div></div>
    </div>
  </div>

  <!-- 2. إدارة الدورات -->
  <div id="tab-courses" class="panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>إدارة الدورات</h2>
      <button class="btn" onclick="openCourseModal()">+ إضافة دورة جديدة</button>
    </div>
    <div class="card-box">
      <div class="table-responsive">
        <table>
          <thead><tr><th>العنوان</th><th>القسم</th><th>السعر</th><th>الحالة</th><th>إجراءات</th></tr></thead>
          <tbody id="coursesTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 3. المهتمين -->
  <div id="tab-enrollments" class="panel">
    <h2 style="margin-bottom: 20px;">الطلاب المهتمون</h2>
    <div class="card-box">
      <div class="table-responsive">
        <table>
          <thead><tr><th>الاسم</th><th>البريد</th><th>الجوال</th><th>الدورة</th></tr></thead>
          <tbody id="enrollTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="courseModal">
  <div class="modal-content">
    <h2 id="modalTitle">إضافة دورة</h2>
    <input type="hidden" id="cId">
    <div class="form-group"><label>عنوان الدورة</label><input type="text" id="cTitle" placeholder="مثال: دورة البايثون الشاملة"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
      <div class="form-group"><label>القسم</label><input type="text" id="cCategory" value="البرمجة"></div>
      <div class="form-group"><label>السعر (ر.س)</label><input type="number" id="cPrice" value="0"></div>
    </div>
    <div class="form-group"><label>اسم المدرب</label><input type="text" id="cInstructor" value="فريق المنصة"></div>
    <div class="form-group"><label>وصف الدورة</label><textarea id="cDesc" rows="3"></textarea></div>
    
    <h3 style="margin: 20px 0 15px; border-top: 1px solid #e2e8f0; padding-top: 20px;">دروس الدورة والفيديوهات</h3>
    <div id="lessonsContainer"></div>
    <button class="btn" type="button" onclick="addLessonRow()" style="background: #64748b; margin-bottom: 20px; width: 100%;">+ إضافة درس جديد</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button class="btn" style="flex: 1; padding: 15px;" onclick="saveCourse()">حفظ الدورة</button>
      <button class="btn btn-red" style="flex: 1; padding: 15px;" onclick="document.getElementById('courseModal').classList.remove('active')">إلغاء</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const STORAGE_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/storage/v1/object/public/videos/";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const HEADERS = { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' };

  let courses = [], enrollments = [], currentLessons = [];

  function switchTab(tabId, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    if(el) el.classList.add('active');
    if(window.innerWidth <= 768) document.querySelector('.sidebar').classList.remove('open');
  }

  async function loadData() {
    let res = await fetch(`${API_URL}/courses?select=*,course_lessons(*)&order=created_at.desc`, { headers: HEADERS });
    courses = await res.json();
    
    res = await fetch(`${API_URL}/enrollments?select=*,courses(title)&order=created_at.desc`, { headers: HEADERS });
    enrollments = await res.json();

    document.getElementById('statCourses').innerText = courses.length;
    document.getElementById('statEnrolls').innerText = enrollments.length;

    document.getElementById('coursesTable').innerHTML = courses.map(c => `
      <tr>
        <td><b>${c.title}</b></td><td>${c.category}</td><td>${c.price} ر.س</td>
        <td><span style="background:#d1fae5; color:#065f46; padding:4px 8px; border-radius:6px; font-size:12px;">منشورة</span></td>
        <td>
          <button class="btn btn-sm" onclick="editCourse('${c.id}')">تعديل</button>
          <button class="btn btn-red btn-sm" onclick="deleteCourse('${c.id}')">حذف</button>
        </td>
      </tr>
    `).join('');

    document.getElementById('enrollTable').innerHTML = enrollments.map(e => `
      <tr><td>${e.full_name}</td><td dir="ltr" style="text-align:right">${e.email}</td><td dir="ltr" style="text-align:right">${e.phone || '-'}</td><td>${e.courses?.title || 'محذوفة'}</td></tr>
    `).join('');
  }

  // --- إدارة الفيديوهات والدروس ---
  window.addLessonRow = () => {
    currentLessons.push({ id: Date.now(), title: '', duration: '', video_url: '' });
    renderLessons();
  };

  window.removeLesson = (id) => {
    currentLessons = currentLessons.filter(l => l.id !== id);
    renderLessons();
  };

  function renderLessons() {
    document.getElementById('lessonsContainer').innerHTML = currentLessons.map((l, i) => `
      <div class="lesson-row">
        <input type="text" placeholder="عنوان الدرس" value="${l.title}" oninput="currentLessons[${i}].title=this.value">
        <input type="text" placeholder="المدة 2:00" value="${l.duration}" oninput="currentLessons[${i}].duration=this.value">
        
        <div style="position:relative;">
          <input type="file" accept="video/*" onchange="uploadVideo(this, ${i})" style="width:100%; font-size:12px; padding:8px;">
          ${l.video_url ? `<div style="font-size:11px; color:var(--green); font-weight:700; margin-top:5px;">✓ تم الرفع بنجاح</div>` : ''}
        </div>
        
        <button class="btn btn-red btn-sm" type="button" onclick="removeLesson(${l.id})" style="height:100%;">حذف</button>
      </div>
    `).join('');
  }

  window.uploadVideo = async (input, index) => {
    const file = input.files[0];
    if(!file) return;
    
    // تغيير النص للدلالة على جاري الرفع
    input.parentElement.innerHTML = '<div style="color:var(--green); font-size:12px; font-weight:bold;">جاري الرفع... ⏳</div>';
    
    const fileName = `vid_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
    
    // استخدام FormData لضمان التوافق مع الهواتف
    const formData = new FormData();
    formData.append('', file);

    try {
      const res = await fetch(`https://rzostpeiwkdfpozhqsrv.supabase.co/storage/v1/object/videos/${fileName}`, {
        method: 'POST',
        headers: {
          'apikey': API_KEY,
          'Authorization': `Bearer ${API_KEY}`
          // ملاحظة: لا نضع Content-Type هنا، المتصفح سيضعه تلقائياً مع FormData
        },
        body: file // في Supabase نرسل الملف مباشرة وليس FormData، لكننا سنستخدم الملف المباشر
      });

      if(res.ok) {
        currentLessons[index].video_url = STORAGE_URL + fileName;
        renderLessons();
      } else {
        const err = await res.text();
        alert('فشل الرفع: ' + err);
        renderLessons();
      }
    } catch(e) {
      alert('خطأ في الشبكة أثناء الرفع.');
      renderLessons();
    }
  };

  // --- حفظ الدورة ---
  window.openCourseModal = () => {
    document.getElementById('cId').value = '';
    document.getElementById('cTitle').value = '';
    document.getElementById('cCategory').value = 'البرمجة';
    document.getElementById('cInstructor').value = 'فريق المنصة';
    document.getElementById('cPrice').value = '0';
    document.getElementById('cDesc').value = '';
    currentLessons = [];
    renderLessons();
    document.getElementById('modalTitle').innerText = 'إضافة دورة';
    document.getElementById('courseModal').classList.add('active');
  };

  window.editCourse = (id) => {
    const c = courses.find(x => x.id == id);
    if(!c) return;
    document.getElementById('cId').value = c.id;
    document.getElementById('cTitle').value = c.title;
    document.getElementById('cCategory').value = c.category;
    document.getElementById('cInstructor').value = c.instructor;
    document.getElementById('cPrice').value = c.price;
    document.getElementById('cDesc').value = c.description || '';
    currentLessons = (c.course_lessons || []).map(l => ({...l, id: Date.now() + Math.random()}));
    renderLessons();
    document.getElementById('modalTitle').innerText = 'تعديل دورة';
    document.getElementById('courseModal').classList.add('active');
  };

  window.saveCourse = async () => {
    const id = document.getElementById('cId').value;
    const payload = {
      title: document.getElementById('cTitle').value,
      category: document.getElementById('cCategory').value,
      instructor: document.getElementById('cInstructor').value,
      price: Number(document.getElementById('cPrice').value),
      description: document.getElementById('cDesc').value,
      published: true
    };

    let method = id ? 'PATCH' : 'POST';
    let url = id ? `${API_URL}/courses?id=eq.${id}` : `${API_URL}/courses`;
    let headers = { ...HEADERS };
    if(!id) headers['Prefer'] = 'return=representation';

    let res = await fetch(url, { method, headers, body: JSON.stringify(payload) });
    let savedCourse = await res.json();
    
    let courseId = id ? id : savedCourse[0].id;

    // حذف الدروس القديمة إن وجدت
    await fetch(`${API_URL}/course_lessons?course_id=eq.${courseId}`, { method: 'DELETE', headers: HEADERS });
    
    // إضافة الدروس الجديدة
    if(currentLessons.length > 0) {
      const lessonPayload = currentLessons.map((l, i) => ({
        course_id: courseId,
        title: l.title || `الدرس ${i+1}`,
        duration: l.duration || '',
        video_url: l.video_url || '',
        sort_order: i
      }));
      await fetch(`${API_URL}/course_lessons`, { method: 'POST', headers: HEADERS, body: JSON.stringify(lessonPayload) });
    }

    document.getElementById('courseModal').classList.remove('active');
    loadData();
    alert('تم حفظ الدورة والدروس بنجاح!');
  };

  window.deleteCourse = async (id) => {
    if(!confirm('هل أنت متأكد من حذف الدورة نهائياً؟')) return;
    await fetch(`${API_URL}/courses?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
    loadData();
  };

  loadData();
</script>
</body>
</html>
