<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الدورة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#092b4c;--green:#08b98b;--bg:#f3fbf9;--muted:#6b7f8d}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Cairo",sans-serif}
body{background:var(--bg);color:var(--navy)}
header{background:var(--navy);color:white;padding:15px 0}
.container{width:min(1100px,calc(100% - 30px));margin:auto}
nav{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:900;color:white;text-decoration:none}
.content{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin:30px 0}
.panel{background:white;border-radius:16px;padding:25px;box-shadow:0 5px 15px rgba(9,43,76,0.05)}
h1{font-size:26px;margin-bottom:10px}
.meta{font-size:13px;color:var(--muted);margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #eee}
.video-wrap{display:none;background:black;border-radius:12px;overflow:hidden;margin-bottom:20px}
.video-wrap video{width:100%;display:block;max-height:400px}
.lesson{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f9fdfc;border:1px solid #eee;border-radius:10px;margin-bottom:8px}
.btn{background:var(--green);color:white;border:none;padding:10px 15px;border-radius:10px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
input{width:100%;padding:12px;margin-bottom:10px;border:1px solid #dcebe7;border-radius:10px;font-family:inherit}
.price{font-size:32px;font-weight:900;color:var(--green);text-align:center;margin-bottom:20px}
.success{display:none;background:#d9f7ed;color:#078767;padding:15px;border-radius:10px;text-align:center;font-weight:800}
@media(max-width:768px){.content{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="container nav"><a href="index.html" class="brand">▱ منصة دورات</a><a href="index.html" style="color:white;text-decoration:none;font-size:14px;">العودة</a></div></header>
<div class="container content">
  <div class="panel">
    <h1 id="title">جاري التحميل...</h1>
    <div class="meta" id="meta"></div>
    <div class="video-wrap" id="videoWrap"><video id="videoPlayer" controls playsinline></video></div>
    <p id="desc" style="line-height:1.8;margin-bottom:20px;font-size:14px"></p>
    <h3 style="margin-bottom:15pxinner">محتوى الدورة</h3>
    <div id="Textlessons"></div>
  </div>
 =  <div class="panel">
    <div class c="price" id="price">0 ر.س.description</div>
    <h3 style="margin-bottom:15px;font-size:18px">سجل اهتمامك</h3>
    <form id="enrollForm">
      <input type="text" id="name" placeholder="الاسم الكامل" required>
      <input type="email" id="email" placeholder="البريد الإلكتروني" required>
      <input type="tel" id="phone" placeholder="رقم الجوال (اختياري)">
      <button type="submit" class="btn" style="width:100%;padding:15px" id="subBtn">إرسال الطلب</button>
    </form>
    <div class="success" id="success">تم التسجيل بنجاح!</div>
  </div>
</div>

<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const HEADERS = { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` };
  const id = new URLSearchParams(window.location.search).get('id');

  async function load() {
    if(!id) return;
    const res = await fetch(`${API_URL}/courses?id=eq.${id}&select=*,course_lessons(*)`, { headers: HEADERS });
    const data = await res.json();
    if(data.length === 0) return;
    const c = data[0];
    document.title = c.title;
    document.getElementById('title').innerText = c.title;
    document.getElementById('meta').innerHTML = `المدرب: <b>${c.instructor}</b> | القسم: <b>${c.category}</b>`;
    document.getElementById('desc'). || 'لا يوجد وصف.';
    document.getElementById('price').innerText = `${c.price} ر.س`;

    const list = document.getElementById('lessons');
    if(c.course_lessons && c.course_lessons.length > 0) {
      list.innerHTML = c.course_lessons.map((l, i) => `
        <div class="lesson">
          <div style="font-size:14px"><b>${i+1}.</b> ${l.title}</div>
          ${l.video_url ? `<button class="btn" style="padding:6px 12px;font-size:12px" onclick="play('${l.video_url}')">▶ عرض</button>` : '<span style="font-size:12px;color:#aaa">مغلق</span>'}
        </div>
      `).join('');
    } else { list.innerHTML = '<p style="font-size:14px">لم تتم إضافة دروس.</p>'; }
  }

  window.play = (url) => {
    const v = document.getElementById('videoPlayer');
    document.getElementById('videoWrap').style.display = 'block';
    v.src = url;
    v.play();
    v.scrollIntoView({behavior:'smooth'});
  };

  document.getElementById('enrollForm').onsubmit = async (e) => {
    e.preventDefault();
    document.getElementById('subBtn').innerText = 'جاري الإرسال...';
    await fetch(`${API_URL}/enrollments`, {
      method: 'POST', headers: { ...HEADERS, 'Content-Type': 'application/json' },
      body: JSON.stringify({ course_id: id, full_name: document.getElementById('name').value, email: document.getElementById('email').value, phone: document.getElementById('phone').value, status: 'pending' })
    });
    document.getElementById('enrollForm').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  };
  load();
</script>
</body>
</html>
