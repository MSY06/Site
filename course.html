<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الدورة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #092b4c; --green: #08b98b; --bg: #f3fbf9; }
  body { margin: 0; font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--navy); }
  header { background: var(--navy); padding: 15px 0; } .container { width: min(1000px, 90%); margin: auto; }
  .nav { display: flex; justify-content: space-between; color: white; } .nav a { color: white; text-decoration: none; font-weight: bold; }
  .content { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 30px; }
  @media(max-width:768px){ .content { grid-templatepx-columns: 1fr; } }
  .panel { background: white solid; padding: 25px; border #-radius: 15px; box-shadow: 0 5eeepx 15px rgba(0,0,0;,0.05); }
  .video border-player { width: 100%; border-radius: 10px; background: black; display: none; margin-bottom: 20px; }
  .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f9fdfc; border: 1-radius: 10px; margin-bottom: 10px; }
  .btn { background: var(--green); color: white; padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; width: 100%; }
  input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
</style>
</head>
<body>
<header><div class="container nav"><div style="font-weight:900; font-size:20px;">منصة دورات</div><a href="index.html">العودة للرئيسية</a></div></header>
<div class="container content">
  <div class="panel">
    <h1 id="title" style="color:var(--navy)">جاري التحميل...</h1>
    <p id="meta" style="color:#6b7f8d; font-size:14px; border-bottom: 1px solid #eee; padding-bottom: 10px;"></p>
    
    <video id="videoPlayer" class="video-player" controls playsinline></video>
    
    <p id="desc" style="line-height: 1.8;"></p>
    
    <h3 style="margin-top:30px;">محتوى الدورة:</h3>
    <div id="lessons"></div>
  </div>
  
  <div class="panel">
    <div style="text-align:center; margin-bottom:20px;">
      <div style="font-size:32px; color:var(--green); font-weight:900;" id="price">0 ر.س</div>
      <div style="color:#6b7f8d; font-size:12px;">سعر الدورة كاملة</div>
    </div>
    <h3>سجل اهتمامك</h3>
    <form id="enrollForm">
      <input type="text" id="name" placeholder="الاسم الكامل" required>
      <input type="email" id="email" placeholder="البريد الإلكتروني" required>
      <input type="tel" id="phone" placeholder="رقم الجوال (اختياري)">
      <button type="submit" class="btn" id="subBtn">إرسال الطلب</button>
    </form>
    <div id="msg" style="display:none; text-align:center; color:green; font-weight:bold; margin-top:15px;">تم تسجيل اهتمامك بنجاح!</div>
  </div>
</div>

<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const id = new URLSearchParams(window.location.search).get('id');
  let courseData = null;

  async function loadCourse() {
    if(!id) { document.getElementById('title').innerText = "دورة غير موجودة"; return; }
    
    // جلب الدورة والدروس
    const res = await fetch(`${API_URL}/courses?id=eq.${id}&select=*,course_lessons(*)`, {
      headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` }
    });
    const data = await res.json();
    if(data.length === 0) return;
    
    courseData = data[0];
    document.getElementById('title').innerText = courseData.title;
    document.getElementById('meta').innerText = `المدرب: ${courseData.instructor} | القسم: ${courseData.category} | المدة: ${courseData.hours} ساعات`;
    document.getElementById('desc').innerText = courseData.description || "لا يوجد وصف.";
    document.getElementById('price').innerText = `${courseData.price} ر.س`;

    const lessonsDiv = document.getElementById('lessons');
    if(courseData.course_lessons && courseData.course_lessons.length > 0) {
      const sorted = courseData.course_lessons.sort((a,b) => a.sort_order - b.sort_order);
      lessonsDiv.innerHTML = sorted.map((l, i) => `
        <div class="lesson-item">
          <div><b>${i+1}.</b> ${l.title} <span style="font-size:12px; color:#888;">(${l.duration || 'بدون مدة'})</span></div>
          ${l.video_url ? `<button class="btn" style="width:auto; padding:5px 15px;" onclick="playVideo('${l.video_url}')">▶ عرض</button>` : '<span style="font-size:12px; color:#aaa;">مغلق</span>'}
        </div>
      `).join('');
    } else {
      lessonsDiv.innerHTML = '<p>لم تتم إضافة دروس بعد.</p>';
    }
  }

  window.playVideo = (url) => {
    const v = document.getElementById('videoPlayer');
    v.src = url;
    v.style.display = 'block';
    v.scrollIntoView({ behavior: 'smooth', block: 'center' });
    v.play();
  };

  document.getElementById('enrollForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('subBtn');
    btn.innerText = 'جاري الإرسال...';
    
    const res = await fetch(`${API_URL}/enrollments`, {
      method: 'POST',
      headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        course_id: id,
        full_name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        status: 'pending'
      })
    });
    
    if(res.ok) {
      document.getElementById('enrollForm').style.display = 'none';
      document.getElementById('msg').style.display = 'block';
    } else {
      alert('حدث خطأ، حاول مجدداً.');
      btn.innerText = 'إرسال الطلب';
    }
  };

  loadCourse();
</script>
</body>
</html>
