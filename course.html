<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الدورة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#092b4c;--green:#08b98b;--bg:#f3fbf9;--muted:#6b7f8d}
  *{box-sizing:border-box;margin:0;padding:0;font-family:"Cairo",sans-serif}
  body{background:var(--bg);color:var(--navy)}
  header{background:var(--navy);color:white;padding:15px 0}
  .container{width:min(1100px,calc(100% - 30px));margin:auto}
  nav{display:flex;justify-content:space-between;align-items:center}
  .brand{font-size:22px;font-weight:800;color:white;text-decoration:none}
  .content{display:grid;grid-template-columns:2fr 1fr;gap:25px;margin:40px 0}
  .panel{background:white;border-radius:16px;padding:25px;box-shadow:0 4px 15px rgba(9,43,76,0.05);border:1px solid #e0eeeb}
  h1{font-size:26px;margin-bottom:10px}
  .meta{font-size:14px;color:var(--muted);margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid #eee}
  .video-wrap{display:none;background:black;border-radius:12px;overflow:hidden;margin-bottom:20px}
  .video-wrap video{width:100%;display:block;max-height:400px}
  .lesson{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#f9fdfc;border:1px solid #eee;border-radius:10px;margin-bottom:10px}
  .btn{background:var(--green);color:white;border:none;padding:10px 20px;border-radius:8px;font-weight:800;cursor:pointer;text-decoration:none}
  input{width:100%;padding:14px;margin-bottom:12px;border:1px solid #dcebe7;border-radius:10px;font-family:inherit;outline:none}
  .price{font-size:32px;font-weight:900;color:var(--green);text-align:center;margin-bottom:20px}
  .success{display:none;background:#d9f7ed;color:#078767;padding:15px;border-radius:10px;text-align:center;font-weight:800}
  @media(max-width:768px){.content{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="container nav"><a href="index.html" class="brand">▱ منصة دورات</a><a href="index.html" style="color:white;font-size:14px;text-decoration:none">← العودة</a></div></header>
<div class="container content">
  <div class="panel">
    <h1 id="title">جاري التحميل...</h1>
    <div class="meta" id="meta"></div>
    <div class="video-wrap" id="videoWrap"><video id="videoPlayer" controls playsinline></video></div>
    <p id="desc" style="line-height:1.8;margin-bottom:30px;font-size:15px;color:#506a7a"></p>
    <h3 style="margin-bottom:15px">محتوى الدورة</h3>
    <div id="lessonsList"></div>
  </div>
  <div>
    <div class="panel" style="position:sticky;top:20px;">
      <div class="price" id="price">0 ر.س</div>
      <h3 style="margin-bottom:15px;text-align:center">سجل اهتمامك بالدورة</h3>
      <form id="enrollForm">
        <input type="text" id="name" placeholder="الاسم الكامل *" required>
        <input type="email" id="email" placeholder="البريد الإلكتروني *" required>
        <input type="tel" id="phone" placeholder="رقم الجوال (اختياري)">
        <button type="submit" class="btn" style="width:100%;padding:15px" id="subBtn">تأكيد الطلب</button>
      </form>
      <div class="success" id="successMsg">تم تسجيل طلبك بنجاح!</div>
    </div>
  </div>
</div>

<script>
  const URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const H = { 'apikey': KEY, 'Content-Type': 'application/json' }; // بدون Authorization
  const id = new URLSearchParams(window.location.search).get('id');

  async function load() {
    if(!id) return;
    const res = await fetch(`${URL}/courses?id=eq.${id}&select=*,course_lessons(*)`, { headers: H });
    const data = await res.json();
    if(!data.length) { document.getElementById('title').innerText = "الدورة غير موجودة"; return; }
    
    const c = data[0];
    document.title = c.title;
    document.getElementById('title').innerText = c.title;
    document.getElementById('meta').innerHTML = `المدرب: <b>${c.instructor || 'فريق المنصة'}</b> | القسم: <b>${c.category}</b>`;
    document.getElementById('desc').innerText = c.description || 'لا يوجد وصف.';
    document.getElementById('price').innerText = `${c.price} ر.س`;

    fetch(`${URL}/courses?id=eq.${id}`, { method: 'PATCH', headers: H, body: JSON.stringify({ views: (c.views || 0) + 1 }) });

    const list = document.getElementById('lessonsList');
    if(c.course_lessons && c.course_lessons.length) {
      list.innerHTML = c.course_lessons.sort((a,b)=>a.sort_order-b.sort_order).map((l, i) => `
        <div class="lesson">
          <div><b>${i+1}.</b> ${l.title} <span style="font-size:12px;color:var(--muted)">(${l.duration || 'بدون مدة'})</span></div>
          ${l.video_url ? `<button class="btn" style="padding:6px 15px;font-size:13px" onclick="play('${l.video_url}')">▶ مشاهدة</button>` : '<span style="font-size:12px;color:#aaa">مغلق</span>'}
        </div>
      `).join('');
    } else { list.innerHTML = '<p>لم تتم إضافة دروس بعد.</p>'; }
  }

  window.play = (url) => {
    const v = document.getElementById('videoPlayer');
    document.getElementById('videoWrap').style.display = 'block';
    v.src = url; v.play(); v.scrollIntoView({behavior:'smooth', block:'center'});
  };

  document.getElementById('enrollForm').onsubmit = async (e) => {
    e.preventDefault();
    document.getElementById('subBtn').innerText = 'جاري الإرسال...';
    await fetch(`${URL}/enrollments`, {
      method: 'POST', headers: H,
      body: JSON.stringify({ course_id: id, full_name: document.getElementById('name').value, email: document.getElementById('email').value, phone: document.getElementById('phone').value, status: 'pending' })
    });
    document.getElementById('enrollForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  };
  load();
</script>
</body>
</html>
