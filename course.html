<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل الدورة | منصة دورات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#092b4c;--green:#08b98b;--bg:#f3fbf9;--text:#132e47;--muted:#6b7f8d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",sans-serif}
a{text-decoration:none;color:inherit}.container{width:min(1150px,calc(100% - 30px));margin:auto}
header{background:var(--navy);color:white;padding:15px 0}
.nav{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:25px;font-weight:900;display:flex;align-items:center;gap:10px}
.logo{width:43px;height:43px;border-radius:14px;background:var(--green);display:grid;place-items:center;font-size:25px}
.content{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin:40px 0}
.panel{background:white;border-radius:19px;padding:25px;box-shadow:0 10px 28px #092b4c0b;border:1px solid #e0eeeb}
h1{color:var(--navy);margin-top:0}
.meta-info{color:var(--muted);font-size:14px;margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:15px}
.video-wrap{display:none;background:black;border-radius:15px;overflow:hidden;margin-bottom:20px}
.video-wrap video{width:100%;max-height:500px;display:block}
.lesson{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#f9fdfc;border:1px solid #eee;border-radius:12px;margin-bottom:10px}
.btn{background:var(--green);color:white;border:none;padding:10px 15px;border-radius:10px;font-weight:800;font-family:inherit;cursor:pointer;display:inline-block}
.btn-play{padding:8px 15px;font-size:12px}
input{width:100%;padding:12px;margin-bottom:10px;border:1px solid #dcebe7;border-radius:10px;font-family:inherit;box-sizing:border-box}
.btn-submit{width:100%;padding:15px;font-size:16px}
.success-msg{display:none;background:#d9f7ed;color:#078767;padding:15px;border-radius:10px;text-align:center;font-weight:800}
.price{font-size:36px;font-weight:900;color:var(--green);text-align:center;margin-bottom:20px}
@media(max-width:850px){.content{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="container nav"><a href="index.html" class="brand"><span class="logo">▱</span> منصة دورات</a><a href="index.html" class="btn" style="background:transparent;border:1px solid white">عودة للرئيسية</a></div></header>
<div class="container content">
  <div class="panel">
    <h1 id="cTitle">جاري التحميل...</h1>
    <div class="meta-info" id="cMeta"></div>
    <div class="video-wrap" id="videoWrap"><video id="videoPlayer" controls playsinline></video></div>
    <p id="cDesc" style="line-height:2;color:#506a7a"></p>
    <h3 style="color:var(--navy);margin-top:30px">محتوى الدورة</h3>
    <div id="lessonsList"></div>
  </div>
  <div>
    <div class="panel">
      <div class="price" id="cPrice">0 ر.س</div>
      <h3 style="color:var(--navy);margin-bottom:15px;">سجل اهتمامك</h3>
      <form id="enrollForm">
        <input type="text" id="name" placeholder="الاسم الكامل *" required>
        <input type="email" id="email" placeholder="البريد الإلكتروني *" required>
        <input type="tel" id="phone" placeholder="رقم الجوال (اختياري)">
        <button type="submit" class="btn btn-submit" id="subBtn">تأكيد الطلب</button>
      </form>
      <div class="success-msg" id="successMsg">تم تسجيل طلبك بنجاح! سنتواصل معك قريباً.</div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const HEADERS = { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` };
  const id = new URLSearchParams(window.location.search).get('id');

  async function loadCourse() {
    if(!id) return;
    const res = await fetch(`${API_URL}/courses?id=eq.${id}&select=*,course_lessons(*)`, { headers: HEADERS });
    const data = await res.json();
    if(data.length === 0) { document.getElementById('cTitle').innerText = "الدورة غير موجودة"; return; }
    
    const c = data[0];
    document.title = c.title + " | منصة دورات";
    document.getElementById('cTitle').innerText = c.title;
    document.getElementById('cMeta').innerHTML = `المدرب: <b>${c.instructor}</b> | القسم: <b>${c.category}</b> | المدة: <b>${c.hours || 0} ساعات</b>`;
    document.getElementById('cDesc').innerText = c.description || "لا يوجد وصف.";
    document.getElementById('cPrice').innerText = `${c.price} ر.س`;

    // تحديث المشاهدات
    fetch(`${API_URL}/courses?id=eq.${id}`, { method: 'PATCH', headers: {...HEADERS, 'Content-Type': 'application/json'}, body: JSON.stringify({ views: (c.views || 0) + 1 }) });

    const lessonsDiv = document.getElementById('lessonsList');
    if(c.course_lessons && c.course_lessons.length > 0) {
      const sorted = c.course_lessons.sort((a,b) => a.sort_order - b.sort_order);
      lessonsDiv.innerHTML = sorted.map((l, i) => `
        <div class="lesson">
          <div><b>${i+1}.</b> ${l.title} <span style="font-size:12px;color:var(--muted)">(${l.duration || 'بدون مدة'})</span></div>
          ${l.video_url ? `<button class="btn btn-play" onclick="playVideo('${l.video_url}')">▶ مشاهدة</button>` : '<span style="font-size:12px;color:#aaa;">مغلق</span>'}
        </div>
      `).join('');
    } else { lessonsDiv.innerHTML = '<p>لم تتم إضافة دروس بعد.</p>'; }
  }

  window.playVideo = (url) => {
    const v = document.getElementById('videoPlayer');
    document.getElementById('videoWrap').style.display = 'block';
    v.src = url; v.play();
    v.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  document.getElementById('enrollForm').onsubmit = async (e) => {
    e.preventDefault();
    document.getElementById('subBtn').innerText = 'جاري الإرسال...';
    await fetch(`${API_URL}/enrollments`, {
      method: 'POST', headers: { ...HEADERS, 'Content-Type': 'application/json' },
      body: JSON.stringify({ course_id: id, full_name: document.getElementById('name').value, email: document.getElementById('email').value, phone: document.getElementById('phone').value, status: 'pending' })
    });
    document.getElementById('enrollForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  };
  loadCourse();
</script>
</body>
</html>
