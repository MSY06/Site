<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الدورة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0f172a; --green: #10b981; --bg: #f8fafc; --muted: #64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg); color: var(--navy); line-height: 1.6; }
  header { background: var(--navy); padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
  header a { color: white; text-decoration: none; font-weight: 600; }
  .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
  @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }
  
  .panel { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  h1 { font-size: clamp(24px, 4vw, 32px); margin-bottom: 10px; line-height: 1.3; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 15px; flex-wrap: wrap; }
  
  .video-wrapper { width: 100%; border-radius: 12px; overflow: hidden; background: black; margin-bottom: 20px; display: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
  .video-wrapper video { width: 100%; display: block; max-height: 500px; }
  
  .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
  .lesson-info { font-weight: 600; }
  .lesson-info span { font-size: 12px; color: var(--muted); font-weight: 400; margin-right: 5px; }
  .btn-play { background: var(--green); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 13px; }
  
  .price-box { text-align: center; margin-bottom: 20px; }
  .price-box .val { font-size: 36px; font-weight: 800; color: var(--green); }
  
  input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: inherit; font-size: 16px; outline: none; }
  input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
  .btn-submit { background: var(--green); color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .success-msg { display: none; background: #d1fae5; color: #065f46; padding: 15px; border-radius: 10px; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div style="font-weight:800; font-size:20px;">منصة دورات</div>
  <a href="index.html">← الرئيسية</a>
</header>

<div class="container">
  <div class="panel">
    <h1 id="cTitle">جاري التحميل...</h1>
    <div class="meta" id="cMeta"></div>
    
    <div class="video-wrapper" id="videoWrapper">
      <video id="videoPlayer" controls playsinline controlsList="nodownload"></video>
    </div>
    
    <p id="cDesc" style="margin-bottom: 30px;"></p>
    
    <h3 style="margin-bottom: 15px;">محتوى الدورة</h3>
    <div id="lessonsList"></div>
  </div>
  
  <div>
    <div class="panel">
      <div class="price-box">
        <div class="val" id="cPrice">0 ر.س</div>
        <div style="color:var(--muted); font-size:13px;">سعر الدورة كاملة</div>
      </div>
      <h3 style="margin-bottom: 15px;">سجل اهتمامك</h3>
      <form id="enrollForm">
        <input type="text" id="fullName" placeholder="الاسم الكامل *" required>
        <input type="email" id="email" placeholder="البريد الإلكتروني *" required>
        <input type="tel" id="phone" placeholder="رقم الجوال (اختياري)">
        <button type="submit" class="btn-submit" id="submitBtn">تأكيد الطلب</button>
      </form>
      <div class="success-msg" id="successMsg">تم تسجيل طلبك بنجاح! سنتواصل معك قريباً.</div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const HEADERS = { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` };
  const id = new URLSearchParams(window.location.search).get('id');

  async function loadCourse() {
    if(!id) { document.getElementById('cTitle').innerText = "دورة غير موجودة"; return; }
    const res = await fetch(`${API_URL}/courses?id=eq.${id}&select=*,course_lessons(*)`, { headers: HEADERS });
    const data = await res.json();
    
    if(data.length === 0) { document.getElementById('cTitle').innerText = "الدورة غير متوفرة"; return; }
    
    const c = data[0];
    document.title = `${c.title} | منصة دورات`;
    document.getElementById('cTitle').innerText = c.title;
    document.getElementById('cMeta').innerHTML = `<span><b>المدرب:</b> ${c.instructor}</span> <span><b>القسم:</b> ${c.category}</span>`;
    document.getElementById('cDesc').innerText = c.description || "لا يوجد وصف.";
    document.getElementById('cPrice').innerText = `${c.price} ر.س`;

    const lessonsDiv = document.getElementById('lessonsList');
    if(c.course_lessons && c.course_lessons.length > 0) {
      const sorted = c.course_lessons.sort((a,b) => a.sort_order - b.sort_order);
      lessonsDiv.innerHTML = sorted.map((l, i) => `
        <div class="lesson-item">
          <div class="lesson-info">${i+1}. ${l.title} <span>(${l.duration || 'بدون مدة'})</span></div>
          ${l.video_url ? `<button class="btn-play" onclick="playVideo('${l.video_url}')">▶ مشاهدة</button>` : '<span style="font-size:12px; color:#cbd5e1;">مغلق</span>'}
        </div>
      `).join('');
    } else {
      lessonsDiv.innerHTML = '<p style="color:var(--muted)">سيتم إضافة الدروس قريباً.</p>';
    }
  }

  window.playVideo = (url) => {
    const v = document.getElementById('videoPlayer');
    const wrapper = document.getElementById('videoWrapper');
    v.src = url;
    wrapper.style.display = 'block';
    wrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
    v.play();
  };

  document.getElementById('enrollForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.innerText = 'جاري الإرسال...';
    btn.disabled = true;
    
    await fetch(`${API_URL}/enrollments`, {
      method: 'POST',
      headers: { ...HEADERS, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        course_id: id,
        full_name: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        status: 'pending'
      })
    });
    
    document.getElementById('enrollForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  };

  loadCourse();
</script>
</body>
</html>
