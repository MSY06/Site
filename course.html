<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الدورة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0f172a; --green: #10b981; --bg: #f8fafc; --muted: #64748b; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
  body { background: var(--bg); color: var(--navy); }
  header { background: var(--navy); padding: 15px 20px; color: white; display: flex; justify-content: space-between; }
  header a { color: white; text-decoration: none; font-weight: 600; }
  .container { max-width: 1000px; margin: 30px auto; padding: 0 15px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
  @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }
  .panel { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  h1 { font-size: 26px; margin-bottom: 10px; }
  .video-wrapper { display: none; background: black; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .video-wrapper video { width: 100%; max-height: 500px; display: block; }
  .lesson-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f8fafc; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
  .btn-play { background: var(--green); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; }
  input { width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: inherit; }
  .btn-submit { background: var(--green); color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; font-size: 16px; }
  .success-msg { display: none; background: #d1fae5; color: #065f46; padding: 15px; border-radius: 10px; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<header><div style="font-weight:800;">منصة دورات</div><a href="index.html">← الرئيسية</a></header>
<div class="container">
  <div class="panel">
    <h1 id="cTitle">جاري التحميل...</h1>
    <div id="cMeta" style="color:var(--muted); font-size:14px; margin-bottom:20px; padding-bottom:10px; border-bottom:1px solid #f1f5f9;"></div>
    <div class="video-wrapper" id="videoWrapper"><video id="videoPlayer" controls playsinline></video></div>
    <p id="cDesc" style="margin-bottom:20px; line-height:1.8;"></p>
    <h3 style="margin-bottom:10px;">محتوى الدورة</h3>
    <div id="lessonsList"></div>
  </div>
  <div>
    <div class="panel">
      <div style="text-align:center; margin-bottom:20px;">
        <div style="font-size:32px; font-weight:800; color:var(--green);" id="cPrice"></div>
        <div style="color:var(--muted); font-size:13px;">سعر الدورة كاملة</div>
      </div>
      <h3 style="margin-bottom:15px;">سجل اهتمامك</h3>
      <form id="enrollForm">
        <input type="text" id="fullName" placeholder="الاسم الكامل *" required>
        <input type="email" id="email" placeholder="البريد الإلكتروني *" required>
        <input type="tel" id="phone" placeholder="رقم الجوال (اختياري)">
        <button type="submit" class="btn-submit" id="submitBtn">تأكيد الطلب</button>
      </form>
      <div class="success-msg" id="successMsg">تم تسجيل طلبك بنجاح! سنتواصل معك قريباً.</div>
    </div>
  </div>
</div>
<script>
  const API_URL = "https://rzostpeiwkdfpozhqsrv.supabase.co/rest/v1";
  const API_KEY = "sb_publishable_D-ZORF2XC_DpamNWMQmO9g_tdP_2b0D";
  const HEADERS = { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` };
  const id = new URLSearchParams(window.location.search).get('id');

  async function loadCourse() {
    if(!id) return;
    const res = await fetch(`${API_URL}/courses?id=eq.${id}&select=*,course_lessons(*)`, { headers: HEADERS });
    const data = await res.json();
    if(data.length === 0) return;
    const c = data[0];
    
    // تحديث عدد المشاهدات
    fetch(`${API_URL}/courses?id=eq.${id}`, { method: 'PATCH', headers: {...HEADERS, 'Content-Type': 'application/json'}, body: JSON.stringify({ views: (c.views || 0) + 1 }) });

    document.title = c.title;
    document.getElementById('cTitle').innerText = c.title;
    document.getElementById('cMeta').innerHTML = `👤 المدرب: <b>${c.instructor}</b> | ⏱️ المدة: <b>${c.hours} ساعة</b> | 👁️ المشاهدات: <b>${c.views || 0}</b>`;
    document.getElementById('cDesc').innerText = c.description || "لا يوجد وصف.";
    document.getElementById('cPrice').innerText = `${c.price} ر.س`;

    const list = document.getElementById('lessonsList');
    if(c.course_lessons && c.course_lessons.length > 0) {
      list.innerHTML = c.course_lessons.sort((a,b)=>a.sort_order-b.sort_order).map((l, i) => `
        <div class="lesson-item">
          <div><b>${i+1}.</b> ${l.title} <span style="font-size:12px; color:#888;">(${l.duration || 'بدون مدة'})</span></div>
          ${l.video_url ? `<button class="btn-play" onclick="playVideo('${l.video_url}')">▶ عرض</button>` : '<span style="font-size:12px; color:#aaa;">مغلق</span>'}
        </div>
      `).join('');
    } else { list.innerHTML = '<p>سيتم إضافة الدروس قريباً.</p>'; }
  }

  window.playVideo = (url) => {
    const v = document.getElementById('videoPlayer');
    document.getElementById('videoWrapper').style.display = 'block';
    v.src = url; v.play();
    v.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  document.getElementById('enrollForm').onsubmit = async (e) => {
    e.preventDefault();
    document.getElementById('submitBtn').innerText = 'جاري الإرسال...';
    await fetch(`${API_URL}/enrollments`, {
      method: 'POST', headers: { ...HEADERS, 'Content-Type': 'application/json' },
      body: JSON.stringify({ course_id: id, full_name: document.getElementById('fullName').value, email: document.getElementById('email').value, phone: document.getElementById('phone').value, status: 'pending' })
    });
    document.getElementById('enrollForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  };
  loadCourse();
</script>
</body>
</html>
